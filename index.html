<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>K-JUMPING Gameplay Test</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed7ec;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
#game{position:fixed;inset:0;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:7px;align-items:center;z-index:5;pointer-events:none}
.pause{width:48px;height:48px;border:0;border-radius:50%;background:#234b5c;color:white;font-weight:900;font-size:22px}
.logo{height:48px;min-width:145px;padding:5px 15px;border-radius:16px;background:#5a3d2b;border:3px solid #e7bd62;color:#ffd66a;text-align:center;font-weight:1000;font-size:17px;box-shadow:0 4px 10px #0002}.logo small{display:block;color:#fff;font-size:9px}
.stat{height:48px;min-width:72px;border-radius:16px;background:#244e60;border:2px solid #6b9bad;color:#fff;text-align:center;padding:5px 8px}.stat b{display:block;font-size:9px}.stat span{font-size:18px;color:#ffd84d;font-weight:1000}
.height{position:absolute;right:14px;top:72px;width:145px;border-radius:18px;background:#f7fbfc;color:#285364;text-align:center;padding:8px 6px;box-shadow:0 7px 18px #0002}.height small{font-size:9px;font-weight:900}.height strong{display:block;font-size:27px;line-height:31px}
.hint{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);color:#fff;font-weight:1000;text-shadow:0 2px 4px #234;opacity:0;z-index:6}.hint.show{opacity:1}
.gauge{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(290px,70vw);z-index:8;opacity:0;transition:.18s}.gauge.show{opacity:1}
.arc{height:92px;border:11px solid #70432f;border-bottom:0;border-radius:170px 170px 0 0;background:conic-gradient(from 270deg,#3c9ce5 0 24%,#49c995 24% 43%,#ffd34e 43% 57%,#ff9e2c 57% 78%,#e95764 78% 100%);position:relative}
.needle{position:absolute;left:50%;bottom:0;width:4px;height:77px;background:#fff;border-radius:4px;transform-origin:50% 100%;box-shadow:0 0 4px #332}
.grade{position:absolute;left:0;right:0;top:31px;text-align:center;color:#fff;font-weight:1000;font-size:15px;text-shadow:0 2px 3px #513}
.tap{display:block;width:178px;height:52px;margin:7px auto 0;border-radius:18px;border:3px solid #ffe7a0;background:linear-gradient(#ffd66c,#f29a2d);color:#fff;font-weight:1000;font-size:22px;box-shadow:0 5px 0 #92491f}
</style></head><body><div id="game"><canvas id="c"></canvas>
<div class="hud"><div class="pause">Ⅱ</div><div class="logo">K-JUMPING<small>널뛰기팡</small></div><div class="stat"><b>STARS</b><span id="stars">0</span></div><div class="stat"><b>GEMS</b><span id="gems">0</span></div></div>
<div class="height"><small>HEIGHT</small><strong id="height">0 m</strong><small>BEST 0 m</small></div><div class="hint" id="hint">TAP으로 출발!</div>
<div class="gauge" id="gauge"><div class="arc"><div class="needle" id="needle"></div><div class="grade" id="grade">PERFECT</div></div><button class="tap" id="tap">TAP!</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,D;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const P={gravity:1650,launch:-1180,airMax:650,cameraStart:230,cameraLead:.48,cameraSmooth:7.5,gaugeSpeed:1.9};
let g={phase:'ready',t:0,x:0,y:0,vy:0,vx:0,cam:0,gauge:.5,stars:0,gems:0};
let stars=[];for(let i=0;i<18;i++){let a=i/17*Math.PI*1.35;stars.push({x:Math.sin(a)*150+(i%2?18:-10),y:-170-i*105,gem:i==5||i==13})}
function reset(){g={phase:'ready',t:performance.now()/1000,x:0,y:0,vy:0,vx:0,cam:0,gauge:.5,stars:0,gems:0};stars.forEach(s=>s.got=false);$('#gauge').classList.add('show');$('#hint').classList.add('show')}reset();
function lerp(a,b,t){return a+(b-a)*t}function sy(y){return H*.73+y-g.cam}
function sky(){let q=x.createLinearGradient(0,0,0,H);q.addColorStop(0,'#86d8ee');q.addColorStop(.65,'#b8e8f1');q.addColorStop(1,'#6c9bb1');x.fillStyle=q;x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.56)';[[.16,170,125,28],[.72,285,180,36],[.42,530,150,28]].forEach(a=>{x.beginPath();x.ellipse(W*a[0],a[1]+g.cam*.12,a[2],a[3],0,0,7);x.fill()});for(let l=0;l<3;l++){x.fillStyle=['rgba(71,135,151,.2)','rgba(61,119,136,.27)','rgba(48,103,120,.34)'][l];x.beginPath();x.moveTo(0,H*.67);for(let i=-1;i<8;i++){let xx=i*W/6;x.lineTo(xx,H*(.49+((i+l)&1)*.13)-g.cam*(.08+l*.04));x.lineTo(xx+W/12,H*.67)}x.lineTo(W,H);x.lineTo(0,H);x.fill()}}
function seesaw(){let Y=sy(0);if(Y<-100||Y>H+120)return;x.save();x.translate(W/2,Y);x.rotate(Math.max(-.16,Math.min(.16,-g.vy*.000055)));x.fillStyle='#6b3e27';x.beginPath();x.roundRect(-W*.37,-15,W*.74,30,13);x.fill();x.fillStyle='#aa632f';x.beginPath();x.roundRect(-W*.37,-9,W*.74,18,9);x.fill();x.fillStyle='#75452d';x.beginPath();x.moveTo(-30,15);x.lineTo(0,82);x.lineTo(30,15);x.closePath();x.fill();x.fillStyle='#342529';x.beginPath();x.arc(-W*.235,-51,22,0,7);x.fill();x.fillStyle='#4ba9d6';x.beginPath();x.roundRect(-W*.275,-29,62,47,14);x.fill();x.restore()}
function player(){let Y=sy(g.y),X=W/2+g.x;if(Y<-140||Y>H+140)return;x.save();x.translate(X,Y);x.rotate(Math.max(-.25,Math.min(.25,g.vx*.00025)));x.fillStyle='#38272b';x.beginPath();x.arc(0,-42,28,0,7);x.fill();x.fillStyle='#f3cdb9';x.beginPath();x.arc(0,-31,22,0,7);x.fill();x.fillStyle='#fff0dc';x.beginPath();x.roundRect(-27,-7,54,54,14);x.fill();x.fillStyle='#d75470';x.beginPath();x.moveTo(-32,8);x.lineTo(0,22);x.lineTo(32,8);x.lineTo(26,24);x.lineTo(0,38);x.lineTo(-26,24);x.closePath();x.fill();x.fillStyle='#477fbd';x.fillRect(-7,5,14,43);x.strokeStyle='#f3cdb9';x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(-20,5);x.lineTo(-43,g.phase==='flight'?-20:18);x.moveTo(20,5);x.lineTo(43,g.phase==='flight'?-18:18);x.stroke();x.strokeStyle='#4a5b80';x.lineWidth=11;x.beginPath();x.moveTo(-12,44);x.lineTo(-23,g.phase==='flight'?68:61);x.moveTo(12,44);x.lineTo(25,g.phase==='flight'?62:61);x.stroke();x.restore()}
function collect(){for(let s of stars){let X=W/2+s.x,Y=sy(s.y);if(Y<-70||Y>H+70||s.got)continue;x.save();x.translate(X,Y);x.rotate(Math.PI/10);x.fillStyle=s.gem?'#65d8ff':'#ffd53e';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();for(let i=0;i<10;i++){let r=i%2?7:18,a=-Math.PI/2+i*Math.PI/5;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.stroke();x.restore()}}
function loop(t){let now=t/1000,dt=Math.min(.033,Math.max(.001,now-g.t));g.t=now;if(g.phase==='ready'){g.gauge=.5+.5*Math.sin(now*P.gaugeSpeed);$('#needle').style.transform='rotate('+(-72+g.gauge*144)+'deg)'}else{g.vy+=P.gravity*dt;g.y+=g.vy*dt;g.vx*=Math.pow(.18,dt);g.x+=g.vx*dt;g.x=Math.max(-W*.36,Math.min(W*.36,g.x));let alt=Math.max(0,-g.y),target=Math.max(0,alt-P.cameraStart)*P.cameraLead;g.cam=lerp(g.cam,target,1-Math.exp(-P.cameraSmooth*dt));$('#height').textContent=Math.round(alt*.55)+' m';for(let s of stars)if(!s.got&&Math.hypot(g.x-s.x,g.y-s.y)<54){s.got=true;s.gem?g.gems++:g.stars++;$('#stars').textContent=g.stars;$('#gems').textContent=g.gems}if(g.y>=0&&g.vy>0){g.y=0;g.vy=0;g.vx=0;g.cam=0;g.phase='ready';$('#gauge').classList.add('show');stars.forEach(s=>s.got=false)}}sky();collect();seesaw();player();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function launch(){if(g.phase!=='ready')return;let d=Math.abs(g.gauge-.5);$('#grade').textContent=d<.07?'PERFECT!':d<.19?'GOOD!':'POWER';g.phase='flight';g.vy=P.launch;g.vx=(g.gauge-.5)*P.airMax*2.1;$('#gauge').classList.remove('show');$('#hint').classList.remove('show')}
$('#tap').onclick=launch;c.onpointerdown=e=>{if(g.phase==='ready')launch()}
</script></body></html>
