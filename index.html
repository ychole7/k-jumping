<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>널뛰기팡 V43</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dff5ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
#game{position:relative;width:min(100vw,480px);height:100vh;margin:auto;overflow:hidden;background:linear-gradient(#86d9ff,#eafaff 68%,#f1ddb0)}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
.ui{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.pill{background:#ffffffdf;border-radius:20px;padding:8px 13px;color:#38586a;font-weight:900;font-size:13px}
.logo{font-size:20px;font-weight:1000;color:#31586c;text-shadow:0 2px #fff}
#state{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:#315b70ed;color:white;border-radius:20px;padding:8px 15px;font-size:13px;font-weight:900;white-space:nowrap;pointer-events:none}
#hint{position:absolute;bottom:184px;left:50%;transform:translateX(-50%);color:white;font-size:15px;font-weight:1000;text-shadow:0 2px 4px #315b70;white-space:nowrap;pointer-events:none}
#tap{position:absolute;z-index:10;left:50%;bottom:105px;transform:translateX(-50%);width:118px;height:62px;border:0;border-radius:32px;background:white;color:#315b70;font-size:20px;font-weight:1000;box-shadow:0 8px 22px #315b7040;cursor:pointer;touch-action:manipulation}
#tap:active{transform:translateX(-50%) scale(.92);background:#ffe9a8}
#msg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;color:#fff;font-size:35px;font-weight:1000;text-shadow:0 3px #55788a,0 8px 20px #315b7050;transition:.12s;pointer-events:none}
#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#pause{position:absolute;z-index:12;top:58px;left:14px;width:42px;height:42px;border:0;border-radius:50%;background:#ffffffdf;color:#315b70;font-size:18px;font-weight:1000;box-shadow:0 5px 15px #315b7030;cursor:pointer}#pause:active{transform:scale(.92)}
#overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#315b7038;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.15s}
#overlay.show{opacity:1;pointer-events:auto}
.card{width:78%;padding:26px 22px;border-radius:24px;background:#fffffff2;text-align:center;box-shadow:0 18px 50px #315b7040}.card h2{margin:0 0 8px;color:#315b70;font-size:25px}.card p{margin:0 0 18px;color:#587180;font-weight:800;font-size:14px}.card button{border:0;border-radius:18px;padding:13px 28px;background:#315b70;color:#fff;font-size:16px;font-weight:1000;cursor:pointer}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="ui"><div class="pill">높이 <b id="score">0</b>m</div><div class="logo">널뛰기팡</div><div class="pill">COMBO <b id="combo">0</b></div></div>
<div id="state">상대 ↓ 내려오는 중</div>
<div id="hint">상대가 내려오면 TAP!</div>
<div id="timingBar" style="position:absolute;left:50%;bottom:174px;transform:translateX(-50%);width:220px;height:9px;border-radius:8px;background:#ffffff66;overflow:hidden;pointer-events:none">
<div id="timingFill" style="width:0%;height:100%;background:#fff;border-radius:8px"></div>
</div>
<div id="milestone" style="position:absolute;top:58px;right:14px;padding:5px 9px;border-radius:14px;background:#ffffffb8;color:#315b70;font-size:11px;font-weight:900;pointer-events:none">다음 목표 10m</div>
<button id="pause" aria-label="일시정지">Ⅱ</button>
<button id="tap">TAP</button>
<div id="msg"></div>
<div id="overlay"><div class="card"><h2 id="overlayTitle">일시정지</h2><p id="overlayText">게임을 잠시 멈췄어요.</p><button id="resume">계속하기</button></div></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,D;
// Lightweight physics layer: centralized motion/collision values.
const PHYSICS={gravity:1500, playerLaunch:-1050, partnerLaunch:-610, groundOffset:40, landingTolerance:16, minRebound:520, maxRebound:820, seesawSpring:7.5, seesawDamp:8.5,
  plankResponse:.00034, maxPlankAngle:.24};
const game={
 mode:'ready',
 readyT:3,
 phase:'partnerFall',
 t:0,
 score:0,best:0,combo:0,worldScroll:0,cameraY:0,
 plank:{x:0,y:0,len:0,ang:0},
 player:{x:0,y:0,vy:0},
 partner:{x:0,y:0,vy:0},
 shake:0,
 slowMo:0, slowMoTarget:10, slowMoTriggered:false
};
let particles=[];

function resize(){
 W=canvas.clientWidth;H=canvas.clientHeight;D=Math.min(devicePixelRatio||1,2);
 canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 game.plank.x=W/2;game.plank.y=H*.70;game.plank.len=W*.70;
 resetPositions();
}
function L(){return game.plank.x-game.plank.len/2+28}
function R(){return game.plank.x+game.plank.len/2-28}
// Height of each standing point on the rotated plank.
function plankYAt(x){return game.plank.y+(x-game.plank.x)*Math.sin(game.plank.ang)}
function standY(x){return plankYAt(x)-PHYSICS.groundOffset}
function resetPositions(){
 game.slowMo=0;game.slowMoTarget=10;game.slowMoTriggered=false;
 game.player.x=R();game.player.y=standY(R());game.player.vy=0;game.player.lastImpactSpeed=0;
 game.partner.x=L();game.partner.y=standY(L());game.partner.vy=0;game.partner.lastImpactSpeed=0;
}

function integrate(body, dt){
  body.vy += PHYSICS.gravity * dt;
  body.y += body.vy * dt;
}
function land(body){
  // Centralized collision test: only a downward-moving body can land, and
  // it must cross the plank's collision plane within a small tolerance.
  const groundY=standY(body.x);
  const crossed=body.y>=groundY-PHYSICS.landingTolerance;
  if(body.vy>0 && crossed){
    const impactSpeed=body.vy;
    body.y=groundY;
    body.vy=0;
    body.lastImpactSpeed=impactSpeed;
    return true;
  }
  return false;
}

function setState(a,b){document.getElementById('state').textContent=a;document.getElementById('hint').textContent=b}
function pop(t){
 const e=document.getElementById('msg');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');
 clearTimeout(pop.tm);pop.tm=setTimeout(()=>e.classList.remove('show'),420);
}
function burst(x,y,side=0){
 for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,s=80+Math.random()*220;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,r:2+Math.random()*3})}
 game.impact=.18; game.impactSide=side;
}

function tap(){
 if(game.mode!=='playing') return;
 // Only a landed partner can be tapped. This is the sole player action.
 if(game.phase!=='partnerReady') return;

 game.partner.y=standY(L());
 game.partner.vy=0;
 game.player.y=standY(R());
 game.combo++;

 game.player.vy=PHYSICS.playerLaunch*(1+Math.min(game.combo,10)*.035);
 game.plank.ang=Math.min(PHYSICS.maxPlankAngle,.14+game.combo*.004);
 game.plankVel=.95;
 game.shake=7;
 burst(L(),game.plank.y);
 pop('팡!');

 document.getElementById('score').textContent=Math.floor(game.score);
 document.getElementById('combo').textContent=game.combo;

 game.phase='playerUp';
 game.t=0;
 setState('PLAYER ↑ 팡!','높이 올라가는 중');
}
function setPause(paused){
  game.mode=paused?'paused':'playing';
  const overlay=document.getElementById('overlay');
  overlay.classList.toggle('show',paused);
  document.getElementById('pause').textContent=paused?'▶':'Ⅱ';
  if(!paused) setState(game.phase==='partnerReady'?'상대 ↓ 착지 완료':'PLAYER ↑ 팡!','게임 계속');
}
const pauseButton=document.getElementById('pause');
pauseButton.addEventListener('click',()=>setPause(game.mode!=='paused'));
document.getElementById('resume').addEventListener('click',()=>setPause(false));

const tapButton=document.getElementById('tap');
tapButton.addEventListener('pointerdown',e=>{
  e.preventDefault();
  tap();
},{passive:false});
tapButton.addEventListener('click',e=>{
  e.preventDefault();
  tap();
});

function update(dt){
 if(game.mode==='paused') return;
 document.getElementById('tap').style.opacity=game.mode==='playing'?'1':'0.55';
 if(game.mode==='ready'){
   game.readyT-=dt;
   const n=Math.max(1,Math.ceil(game.readyT));
   setState('준비 '+n,'곧 시작합니다');
   if(game.readyT<=0){
     game.mode='playing';
     game.t=0;
     setState('상대 ↓ 내려오는 중','상대가 내려오면 TAP!');
     pop('START!');
   }
   return;
 }
 // Brief slow-motion when the player pushes past the next 10m target.
 if(game.slowMo>0){
   game.slowMo=Math.max(0,game.slowMo-dt);
 }
 const timeScale=game.slowMo>0 ? .32 : 1;
 dt*=timeScale;
 game.shake*=.88;
 game.impact=Math.max(0,game.impact-dt);
 // Seesaw angle behaves like a damped spring: impact bends it, then it settles.
 game.plankVel += (-game.plank.ang*PHYSICS.seesawSpring - game.plankVel*PHYSICS.seesawDamp)*dt;
 game.plank.ang += game.plankVel*dt;
 game.plank.ang=Math.max(-PHYSICS.maxPlankAngle,Math.min(PHYSICS.maxPlankAngle,game.plank.ang));
 game.t+=dt;

 if(game.phase==='playerUp'){
   // Camera follows the PLAYER correctly: when the player rises above the
   // focus line, the world moves down on screen while the seesaw stays fixed.
   const focusY=H*.42;
   const desiredCamera=Math.max(0,Math.min(H*.38, focusY-game.player.y));
   game.cameraY += (desiredCamera-game.cameraY)*Math.min(1,dt*5);
   const targetScroll=Math.min(150,Math.max(0,(game.plank.y-game.player.y)*.32));
   game.worldScroll += (targetScroll-game.worldScroll)*Math.min(1,dt*6);
 }else{
   game.worldScroll += (0-game.worldScroll)*Math.min(1,dt*3);
   // Ease the camera back as the player returns to the seesaw.
   game.cameraY += (0-game.cameraY)*Math.min(1,dt*4);
 }

 if(game.phase==='partnerFall'){
   // Partner falls ONCE, then waits. Only TAP can launch PLAYER.
   const u=Math.min(1,game.t/.95);
   const top=standY(L())-130,bottom=standY(L());
   game.partner.x=L();
   game.partner.y=top+(bottom-top)*u*u;
   game.partner.vy=(bottom-top)*2*u/.95;
   game.player.x=R();
   game.player.y=game.plank.y-40;
   if(game.t>=.95){
     game.partner.y=bottom;
     game.partner.vy=0;
     game.phase='partnerReady';
     game.t=0;
     setState('상대 ↓ 착지 완료','TAP 하면 PLAYER가 팡!');
   }
 }
 else if(game.phase==='partnerReady') {
   game.partner.x=L();
   game.partner.y=standY(L());
 }
 else if(game.phase==='playerUp'){
   game.player.x=R();
   integrate(game.player,dt);

   const oldScore=game.score;
   game.score=Math.max(game.score,(game.plank.y-game.player.y)/7);
   game.best=Math.max(game.best,game.score);
   const target=game.slowMoTarget;
   const milestone=document.getElementById('milestone');
   if(milestone)milestone.textContent='다음 목표 '+target+'m';

   // Once the player clears the target by a few meters, give a short
   // "wow" slow-motion moment, then set the next target.
   if(!game.slowMoTriggered && game.score>=target+3){
     game.slowMoTriggered=true;
     game.slowMo=.38;
     pop(target+'m 돌파!');
     game.slowMoTarget+=10;
   }
   if(game.score<target-2) game.slowMoTriggered=false;
   document.getElementById('score').textContent=Math.floor(game.score);

   if(land(game.player)){
     burst(R(),game.plank.y,1);

     // Player landing transfers part of the impact energy to the opposite side.
     // This is a lightweight spring/rebound model, not a full physics engine.
     const impactSpeed=Math.max(0, game.player.lastImpactSpeed || game.player.vy);
     const rebound=Math.max(PHYSICS.minRebound, Math.min(PHYSICS.maxRebound, impactSpeed*.38));
     game.partner.x=L();
     game.partner.y=standY(L());
     game.partner.vy=-rebound;
     game.plank.ang=-Math.min(PHYSICS.maxPlankAngle, .09 + rebound/5200);
     game.plankVel=-.65;
     game.shake=Math.min(8,4+rebound/180);
     game.phase='partnerUp';
     game.t=0;
     pop('쿵!');
     setState('상대 ↑','PLAYER 착지 → 상대 발사');
   }
 }
 else if(game.phase==='partnerUp'){
   game.partner.x=L();
   integrate(game.partner,dt);

   if(land(game.partner)){
     burst(L(),game.plank.y,-1);
     game.plank.ang=-.035;
     game.partner.y=standY(L());
     game.plankVel=.25;

     // IMPORTANT: stop here. The partner is now standing on the plank.
     // It must NOT jump again until the player taps.
     game.phase='partnerReady';
     game.t=0;
     setState('상대 ↓ 착지 완료','TAP 하면 PLAYER가 팡!');
     pop('착지!');
   }
 }

 for(const p of particles){
   p.x+=p.vx*dt;
   p.y+=p.vy*dt;
   p.vy+=500*dt;
   p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);
}
canvas.addEventListener('pointerdown',e=>{
  if(e.target===canvas) tap();
},{passive:true});

function drawBg(){
 const h=game.score;
 let top='#86d9ff', bottom='#eafaff';
 if(h>=10){top='#72c9f4';bottom='#e3f5ff'}
 if(h>=20){top='#69b6e8';bottom='#d9effc'}
 if(h>=30){top='#5b9ed0';bottom='#cfe7f7'}

 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,top);g.addColorStop(.68,bottom);g.addColorStop(1,'#f1ddb0');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // Only the background has altitude motion. The game objects do not.
 const alpha=h<10?.58:h<20?.72:.86;
 ctx.fillStyle=`rgba(255,255,255,${alpha})`;
 const count=h<10?6:h<20?8:10;
 for(let i=0;i<count;i++){
   let x=(i*91+30)%W;
   let y=(i*127+80-game.worldScroll+game.cameraY*.55)%(H+160);
   if(y<0)y+=H+160;
   const sc=1+Math.min(h,40)/100;
   ctx.beginPath();
   ctx.ellipse(x,y,38*sc,12*sc,0,0,Math.PI*2);
   ctx.ellipse(x+28*sc,y+2*sc,25*sc,10*sc,0,0,Math.PI*2);
   ctx.fill();
 }

 // Distant landscape scrolls gently in the opposite direction.
 const ga=Math.max(.12,.48-h*.012);
 ctx.fillStyle=`rgba(167,215,168,${ga})`;
 ctx.save();
 ctx.translate(0,Math.min(60,game.worldScroll*.25+game.cameraY*.18));
 ctx.beginPath();
 ctx.moveTo(0,H*.72);
 for(let x=0;x<=W;x+=40)ctx.lineTo(x,H*.67+Math.sin(x*.026)*18);
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 ctx.restore();

 if(h>=20){
   ctx.fillStyle=`rgba(255,255,255,${Math.min(.14,(h-20)*.003)})`;
   ctx.fillRect(0,0,W,H);
 }
}
function drawPlank(){
 const p=game.plank;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);
 ctx.fillStyle='#6f4e35';ctx.beginPath();ctx.roundRect(-p.len/2,-10,p.len,20,10);ctx.fill();
 ctx.fillStyle='#d39a5d';ctx.beginPath();ctx.roundRect(-p.len/2+4,-8,p.len-8,12,7);ctx.fill();
 ctx.fillStyle='#ffd65b';ctx.beginPath();ctx.arc(-p.len/2+28,0,5,0,7);ctx.arc(p.len/2-28,0,5,0,7);ctx.fill();
 ctx.fillStyle='#704e37';ctx.beginPath();ctx.moveTo(-11,8);ctx.lineTo(11,8);ctx.lineTo(27,75);ctx.lineTo(-27,75);ctx.closePath();ctx.fill();ctx.restore();
}
function drawChar(c,player){
 // When a character is standing on the seesaw, rotate the character with
 // the plank so the feet visually stay attached to its surface. Airborne
 // characters remain upright.
 const grounded = game.phase!=='playerUp' && ((player && game.phase==='partnerUp') || (!player && (game.phase==='partnerReady' || game.phase==='partnerFall' || game.phase==='partnerUp')));
 const followPlank = grounded;
 ctx.save();
 ctx.translate(c.x,c.y);
 if(followPlank) ctx.rotate(game.plank.ang);
 ctx.fillStyle='#4f5360';ctx.beginPath();ctx.roundRect(-18,8,36,25,11);ctx.fill();
 ctx.strokeStyle='#4f5360';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,25);ctx.lineTo(-12,42);ctx.moveTo(7,25);ctx.lineTo(12,42);ctx.stroke();
 ctx.fillStyle=player?'#f18b63':'#65afd5';ctx.beginPath();ctx.roundRect(-21,-5,42,30,12);ctx.fill();
 ctx.fillStyle='#ffd1a7';ctx.beginPath();ctx.arc(0,-22,19,0,7);ctx.fill();
 ctx.fillStyle='#493b36';ctx.beginPath();ctx.arc(0,-29,18,Math.PI,7);ctx.arc(-13,-25,7,0,7);ctx.arc(13,-25,7,0,7);ctx.fill();
 ctx.fillStyle='#4b4650';ctx.beginPath();ctx.arc(-6,-21,2,0,7);ctx.arc(6,-21,2,0,7);ctx.fill();
 if(player){ctx.fillStyle='#315b70';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText('PLAYER',0,-54)}
 ctx.restore();
}
function draw(){
 drawBg();
 ctx.save();
 if(game.shake>1){
   ctx.translate((Math.random()-.5)*game.shake,(Math.random()-.5)*game.shake);
 }
 // The seesaw is screen-fixed. Grounded characters share its rotation;
 // only the airborne PLAYER follows the camera.
 drawPlank();
 drawChar(game.partner,false);
 ctx.save();
 const playerCamera = game.phase==='playerUp' ? game.cameraY : 0;
 ctx.translate(0,playerCamera);
 drawChar(game.player,true);
 ctx.restore();

 ctx.save();
 const particleCamera = game.phase==='playerUp' ? game.cameraY : 0;
 ctx.translate(0,particleCamera);
 for(const p of particles){
   ctx.globalAlpha=p.life/.45;
   ctx.fillStyle='#fff0a5';
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
   ctx.fill();
 }
 ctx.restore();
 ctx.globalAlpha=1;
 ctx.restore();
}
function loop(t){const dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('resize',resize);
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
