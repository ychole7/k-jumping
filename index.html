<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>K-JUMPING</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b7e7f4;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
button{font:inherit;border:0}
.app,.screen{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}

/* ---------- TITLE ---------- */
.title{background:#b7e7f4}
.titleArt{position:absolute;left:0;right:0;top:0;height:min(1060px,70vh);background:url("assets/title/title-bg.jpg") center top/100% auto no-repeat}
.titleFade{position:absolute;left:0;right:0;top:54%;bottom:0;background:linear-gradient(transparent 0%,rgba(183,231,244,.75) 36%,#b7e7f4 68%)}
.startBtn,.playBtn{border-radius:22px;background:linear-gradient(#ffd96f,#f29b2d);border:4px solid #ffe9aa;color:#fff;font-weight:900;letter-spacing:.4px;text-shadow:0 3px 3px rgba(120,60,20,.45);box-shadow:0 7px 0 #984c20,0 12px 24px rgba(65,40,20,.25)}
.startBtn{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);width:min(330px,74vw);height:78px;font-size:32px;z-index:5}

/* ---------- MAP ---------- */
.map{background:#cfe4b5}
.mapHeader{position:absolute;left:0;right:0;top:0;height:108px;z-index:30;background:linear-gradient(#63442f,#3e291f);color:#fff;border-bottom:3px solid #e7b64d;display:flex;align-items:center;padding:15px 18px;gap:14px}
.back{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:34px}
.season h1{font-size:24px;margin:0}.season p{margin:2px 0 0;color:#f1d8b6;font-size:12px}
.resources{margin-left:auto;display:flex;gap:6px}.res{padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:900;font-size:13px}
.mapViewport{position:absolute;inset:108px 0 116px;overflow:hidden;background:#bcd9a8}
.mapWorld{position:absolute;left:0;right:0;top:0;height:6020px;background:url("assets/map/season1-clean-long.jpg") center top/100% 6000px no-repeat}
.mapRoad{position:absolute;left:0;right:0;top:0;height:6020px;pointer-events:none}
.mapRoad:after{content:"";position:absolute;left:50%;top:0;width:120px;height:100%;transform:translateX(-50%);background:rgba(242,194,113,.18);filter:blur(18px)}
.nodes{position:absolute;inset:0;z-index:5}
.node{position:absolute;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;color:#fff;font-size:19px;font-weight:950;background:linear-gradient(#77756e,#4e4b46);border:4px solid #eee2c4;box-shadow:0 6px 0 #49433b,0 8px 16px rgba(0,0,0,.22)}
.node.active{width:76px;height:76px;font-size:25px;background:linear-gradient(#56c7ff,#158fe5);box-shadow:0 8px 0 #16639b,0 9px 20px rgba(0,0,0,.28)}
.node.done{background:linear-gradient(#ffbd45,#e77e23)}
.mapFooter{position:absolute;left:0;right:0;bottom:0;height:116px;z-index:30;background:#173c43;color:#fff;border-top:3px solid #e7b64d;display:flex;align-items:center;padding:16px 24px}
.stageInfo h2{margin:0;font-size:22px}.stageInfo p{margin:5px 0 0;color:#c5d5d2;font-size:12px}
.playBtn{width:190px;height:66px;margin-left:auto;font-size:25px}

/* ---------- GAME ---------- */
.game{background:#91d9ef}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%}
.gameHUD{position:absolute;top:10px;left:12px;right:12px;z-index:20;display:flex;gap:7px;align-items:center}
.pause{width:48px;height:48px;border-radius:50%;background:#214a5c;color:#fff;font-size:22px;font-weight:950}
.pill{border:2px solid rgba(255,255,255,.42);background:#244d5f;color:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.logoPill{flex:1;text-align:center;background:#5a3c2a;border-color:#e8bd63;color:#ffd56c;font-weight:950}.logoPill small{font-size:11px;color:#fff}
.stat{min-width:72px;text-align:center}.stat b{display:block;font-size:10px}.stat span{font-size:19px;color:#ffdd55;font-weight:950}
.heightBox{position:absolute;right:14px;top:75px;width:142px;padding:9px;border-radius:19px;background:rgba(250,253,254,.96);color:#254d5e;text-align:center;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.13)}.heightBox small{font-weight:900;font-size:10px}.heightBox strong{display:block;font-size:28px;line-height:31px}
.gauge{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(315px,70vw);z-index:25;opacity:0;pointer-events:none;transition:opacity .16s}.gauge.show{opacity:1;pointer-events:auto}
.arc{height:104px;border:13px solid #70432f;border-bottom:0;border-radius:180px 180px 0 0;background:conic-gradient(from 270deg,#2d8fe1 0 22%,#45c98e 22% 42%,#ffd44f 42% 58%,#ff9b2b 58% 79%,#e85260 79% 100%);position:relative}
.arc:after{content:"";position:absolute;left:50%;bottom:-7px;width:18px;height:18px;border-radius:50%;background:#ffd33d;border:3px solid #70432f;transform:translateX(-50%)}
.needle{position:absolute;left:50%;bottom:1px;width:4px;height:90px;background:#fff;border-radius:3px;transform-origin:50% 100%;box-shadow:0 0 4px #463}
.gLabel{position:absolute;left:0;right:0;top:39px;text-align:center;color:#fff;font-weight:1000;font-size:17px;text-shadow:0 2px 3px #5b3627}
.tap{display:block;width:190px;height:56px;margin:8px auto 0;border-radius:19px;background:linear-gradient(#ffd66d,#f39a2c);border:3px solid #ffe8a5;color:#fff;font-weight:1000;font-size:23px;box-shadow:0 6px 0 #93481f}
</style>
</head>
<body>
<div class="app">
<section id="title" class="screen active title"><div class="titleArt"></div><div class="titleFade"></div><button class="startBtn" id="start">START</button></section>

<section id="map" class="screen map">
<header class="mapHeader"><button class="back" id="back">‹</button><div class="season"><h1>시즌 1</h1><p>봄의 한옥마을</p></div><div class="resources"><div class="res">♥ 5</div><div class="res">● 0</div><div class="res">◆ 0</div><div class="res">1/100</div></div></header>
<div class="mapViewport" id="mapViewport"><div class="mapWorld"><div class="mapRoad"></div><div class="nodes" id="nodes"></div></div></div>
<footer class="mapFooter"><div class="stageInfo"><h2>STAGE 1</h2><p>첫 번째 널뛰기 도전!</p></div><button class="playBtn" id="play">PLAY ▶</button></footer>
</section>

<section id="game" class="screen game">
<canvas id="gameCanvas"></canvas>
<div class="gameHUD"><button class="pause">Ⅱ</button><div class="pill logoPill">K-JUMPING<br><small>널뛰기팡</small></div><div class="pill stat"><b>STARS</b><span id="stars">0</span></div><div class="pill stat"><b>GEMS</b><span id="gems">0</span></div></div>
<div class="heightBox"><small>HEIGHT</small><strong id="height">0 m</strong><small>BEST 0 m</small></div>
<div class="gauge" id="gauge"><div class="arc"><div class="needle" id="needle"></div><div class="gLabel" id="grade">PERFECT</div></div><button class="tap" id="tap">TAP!</button></div>
</section>
</div>

<script>
const $=s=>document.querySelector(s), screens=[...document.querySelectorAll('.screen')];
function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id))}
$('#start').onclick=()=>{show('map');setTimeout(()=>{$('#mapViewport').scrollTop=5360},40)}
$('#back').onclick=()=>show('title'); $('#play').onclick=()=>startGame();

const nodes=$('#nodes');
for(let i=1;i<=100;i++){
 const t=(i-1)/99, y=45+t*5925;
 const x=50 + Math.sin(t*8.1)*17 + Math.sin(t*2.7)*7;
 const n=document.createElement('button');
 n.className='node'+(i===1?' active':'');
 n.textContent=i;n.style.left=x+'%';n.style.top=y+'px';
 if(i<1)n.classList.add('done');
 n.onclick=()=>{if(i===1)startGame()};
 nodes.appendChild(n);
}

/* GAME ENGINE */
const c=$('#gameCanvas'),ctx=c.getContext('2d');let W,H,D=1;
let G={phase:'ready',t:0,x:0,y:0,vy:0,cam:0,height:0,stars:0,gems:0,gauge:0,combo:0,trail:[]};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

function startGame(){show('game');G={phase:'ready',t:performance.now()/1000,x:W*.5,y:H*.70,vy:0,cam:0,height:0,stars:0,gems:0,gauge:0,combo:0,trail:[]};$('#stars').textContent=0;$('#gems').textContent=0;$('#height').textContent='0 m';$('#gauge').classList.add('show');requestAnimationFrame(loop)}

function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function sky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#83d7ef');g.addColorStop(.65,'#b8e7f1');g.addColorStop(1,'#739eb5');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.58)';
 [[.12,.23,115,27],[.73,.30,175,37],[.43,.55,140,28]].forEach(a=>{ctx.beginPath();ctx.ellipse(W*a[0],H*a[1],a[2],a[3],0,0,Math.PI*2);ctx.fill()});
 // layered mountains
 for(let layer=0;layer<3;layer++){ctx.fillStyle=['rgba(74,131,145,.25)','rgba(65,119,132,.32)','rgba(49,103,119,.40)'][layer];ctx.beginPath();ctx.moveTo(0,H*.66+layer*35);for(let i=0;i<8;i++){ctx.lineTo(i*W/7,H*(.48+((i+layer)%2)*.12)+layer*25);ctx.lineTo((i+1)*W/7,H*.66+layer*35)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
}
function drawSeesaw(){
 const sy=H*.77+G.cam*.18;ctx.save();ctx.translate(W/2,sy);
 const ang=Math.max(-.18,Math.min(.18,-G.vy*.00007));ctx.rotate(ang);
 ctx.fillStyle='#6c3e26';ctx.beginPath();ctx.roundRect(-W*.36,-13,W*.72,26,12);ctx.fill();
 ctx.fillStyle='#a9622d';ctx.beginPath();ctx.roundRect(-W*.36,-8,W*.72,16,8);ctx.fill();
 ctx.fillStyle='#75462f';ctx.beginPath();ctx.moveTo(-34,13);ctx.lineTo(0,74);ctx.lineTo(34,13);ctx.closePath();ctx.fill();
 // partner
 ctx.fillStyle='#3b282a';ctx.beginPath();ctx.arc(-W*.22,-47,22,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#49a9d7';ctx.beginPath();ctx.roundRect(-W*.27,-25,55,46,14);ctx.fill();
 ctx.fillStyle='#f7f0df';ctx.beginPath();ctx.roundRect(-W*.255,-15,44,25,9);ctx.fill();
 ctx.restore()
}
function drawPlayer(){
 const x=G.x,y=G.y-G.cam*.72;ctx.save();ctx.translate(x,y);
 // shadow
 ctx.fillStyle='rgba(35,72,82,.16)';ctx.beginPath();ctx.ellipse(0,45,35,9,0,0,Math.PI*2);ctx.fill();
 // hair/head
 ctx.fillStyle='#34252a';ctx.beginPath();ctx.arc(0,-40,27,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f5d2bd';ctx.beginPath();ctx.arc(0,-30,22,0,Math.PI*2);ctx.fill();
 // hanbok body
 ctx.fillStyle='#fff3df';ctx.beginPath();ctx.roundRect(-26,-8,52,54,14);ctx.fill();
 ctx.fillStyle='#d95772';ctx.beginPath();ctx.moveTo(-31,8);ctx.lineTo(0,20);ctx.lineTo(31,8);ctx.lineTo(26,22);ctx.lineTo(0,36);ctx.lineTo(-26,22);ctx.closePath();ctx.fill();
 ctx.fillStyle='#477fbc';ctx.fillRect(-7,6,14,39);
 // limbs
 ctx.strokeStyle='#f5d2bd';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,4);ctx.lineTo(-42,-18);ctx.moveTo(20,4);ctx.lineTo(43,-14);ctx.stroke();
 ctx.strokeStyle='#4c5b7d';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-12,43);ctx.lineTo(-23,65);ctx.moveTo(12,43);ctx.lineTo(25,62);ctx.stroke();
 ctx.restore()
}
function drawTrail(){
 if(G.phase!=='flight')return;
 const sx=G.x+80, sy=G.y-G.cam*.72-85;
 for(let i=0;i<10;i++){const a=-2.45+i*.27,r=75+i*8,x=sx+Math.cos(a)*r,y=sy+Math.sin(a)*r;ctx.save();ctx.translate(x,y);ctx.rotate(.2*i);ctx.fillStyle=i%3===0?'#4dcfff':'#ffd43c';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();for(let k=0;k<10;k++){const rr=k%2?7:18,aa=-Math.PI/2+k*Math.PI/5;ctx.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
}
function loop(ts){
 if(!$('#game').classList.contains('active'))return;
 const now=ts/1000,dt=Math.min(.033,Math.max(.001,now-G.t));G.t=now;
 sky();
 if(G.phase==='ready'){
   G.gauge=.5+.5*Math.sin(now*2.35);
   const deg=-72+G.gauge*144;$('#needle').style.transform=`rotate(${deg}deg)`;
 } else if(G.phase==='flight'){
   G.vy+=1550*dt;G.y+=G.vy*dt;
   const altitude=Math.max(0,H*.70-G.y);
   G.cam=Math.max(0,Math.min(560,altitude*.55));
   G.height=Math.round(G.cam*.52);
   $('#height').textContent=G.height+' m';
   if(G.y<125){G.y=125;G.vy=80}
   if(G.y>=H*.70){G.y=H*.70;G.vy=0;G.phase='ready';G.cam=0;$('#gauge').classList.add('show')}
 }
 drawTrail();drawSeesaw();drawPlayer();
 requestAnimationFrame(loop)
}
$('#tap').onclick=()=>{
 if(G.phase!=='ready')return;
 const pos=G.gauge; const dist=Math.abs(pos-.5);
 if(dist<.08){G.combo++;G.stars+=5;G.gems+=1;$('#grade').textContent='PERFECT!'}
 else if(dist<.20){G.combo++;G.stars+=3;$('#grade').textContent='GOOD!'}
 else {G.combo=0;$('#grade').textContent='POWER'}
 $('#stars').textContent=G.stars;$('#gems').textContent=G.gems;
 G.phase='flight';G.vy=-1120;$('#gauge').classList.remove('show')
};
</script>
</body>
</html>
