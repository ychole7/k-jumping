<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>널뛰기 점프</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1020;touch-action:none;user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stageEl{position:relative;overflow:hidden;background:#8fd0ff;box-shadow:0 0 40px rgba(0,0,0,.5);}
  canvas{display:block;position:absolute;inset:0;z-index:0;pointer-events:none;}
  .scene{position:absolute;inset:0;display:none;flex-direction:column;z-index:1;}
  .scene.on{display:flex;}
  .wood{background:linear-gradient(#a6702f,#7c4f1d);border:3px solid #5a3813;border-radius:14px;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.25),0 3px 5px rgba(0,0,0,.3);color:#fff;
    text-shadow:0 2px 2px rgba(0,0,0,.4);}
  .btn{background:linear-gradient(#ffd85a,#ffb733);color:#5a3d00;border:none;border-radius:20px;
    padding:16px 44px;font-size:22px;font-weight:900;box-shadow:0 6px 0 #cf8a00;cursor:pointer;
    text-shadow:0 1px 0 rgba(255,255,255,.4);}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #cf8a00;}

  #title{align-items:center;justify-content:flex-end;padding-bottom:12%;gap:22px;text-align:center;}
  #logo{font-size:52px;font-weight:900;color:#ff5a3c;letter-spacing:-2px;
    text-shadow:0 4px 0 #7c2d00,0 0 20px rgba(255,180,0,.6);-webkit-text-stroke:2px #fff;}
  #logo small{display:block;font-size:24px;color:#fff;-webkit-text-stroke:1px #7c4f1d;margin-top:4px;}
  #best-title{color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.3);}

  #hud{position:absolute;top:calc(env(safe-area-inset-top,0px)+10px);left:0;width:100%;padding:0 12px;
    pointer-events:none;font-weight:800;display:flex;justify-content:space-between;align-items:center;z-index:10;}
  #hearts{font-size:24px;}
  #hStat{display:flex;gap:8px;}
  #hStat .wood{padding:6px 14px;font-size:16px;}
  #depth{position:absolute;top:16%;left:0;width:100%;text-align:center;color:#fff;font-weight:900;font-size:38px;
    text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;z-index:10;}
  #judge{position:absolute;top:38%;left:50%;font-size:46px;font-weight:900;opacity:0;transform:translate(-50%,-50%);
    text-shadow:0 3px 0 rgba(0,0,0,.2);-webkit-text-stroke:2px rgba(255,255,255,.9);pointer-events:none;z-index:10;}

  #result{align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;}
  #resCard{background:linear-gradient(#f3e3c0,#e6cf9c);border:5px solid #a6702f;border-radius:24px;
    padding:26px;width:min(86%,340px);box-shadow:0 10px 24px rgba(0,0,0,.4);color:#5a3d1a;}
  #resCard h2{font-size:22px;margin-bottom:8px;}
  #resM{font-size:44px;font-weight:900;color:#c0392b;}
  #resCard .line{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:6px 4px;border-bottom:1px dashed #b99a63;}
  .hide{display:none!important;}

  /* K-JUMPING final gameplay UI */
  #regionBadge{position:absolute;top:calc(env(safe-area-inset-top,0px)+82px);left:14px;z-index:10;
    min-width:145px;padding:8px 12px 9px;border:3px solid #5a3813;border-radius:13px;
    background:linear-gradient(#f1dfb5,#d5b77d);color:#5a3d1a;text-align:center;
    box-shadow:0 4px 7px rgba(0,0,0,.25);text-shadow:none;pointer-events:none;}
  #regionBadge b{display:block;font-size:19px;line-height:1.05;}
  #regionBadge span{display:block;font-size:12px;font-weight:900;margin-top:3px;}
  #pauseBtn{width:48px;height:48px;padding:0;border-radius:13px;font-size:25px;line-height:1;}
  #progressStrip{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px)+10px);height:58px;z-index:10;
    background:rgba(17,38,68,.9);border:3px solid rgba(255,255,255,.35);border-radius:18px;
    box-shadow:0 6px 14px rgba(0,0,0,.25);pointer-events:none;padding:8px 12px;}
  #progressLine{position:absolute;left:35px;right:35px;top:20px;height:5px;background:rgba(255,255,255,.4);border-radius:8px;}
  #progressFill{height:100%;width:0%;background:#ffe06a;border-radius:8px;box-shadow:0 0 7px rgba(255,224,106,.8);}
  .mile{position:absolute;top:10px;transform:translateX(-50%);text-align:center;color:#fff;font-size:9px;font-weight:900;text-shadow:0 2px 2px #000;}
  .mile i{display:block;width:16px;height:16px;margin:0 auto 2px;border-radius:50%;background:#fff;border:3px solid #f5d56a;box-shadow:0 0 4px #000;}
  .mile.active i{background:#ffe06a;box-shadow:0 0 10px #ffe06a;}
  .mile em{font-style:normal;white-space:nowrap;}
  #progressStrip .m0{left:5%;}.m1{left:28%;}.m2{left:50%;}.m3{left:72%;}.m4{left:95%;}
  #pauseOverlay{position:absolute;inset:0;background:rgba(7,20,40,.62);z-index:30;display:none;align-items:center;justify-content:center;}
  #pauseOverlay.on{display:flex;}
  #pauseCard{width:min(80%,310px);padding:24px;text-align:center;background:linear-gradient(#f3e3c0,#e6cf9c);
    border:5px solid #a6702f;border-radius:24px;color:#5a3d1a;box-shadow:0 10px 30px rgba(0,0,0,.45);}
  #pauseCard h2{font-size:28px;margin-bottom:16px;}
  #pauseCard .btn{margin:5px;font-size:18px;padding:12px 26px;}
</style>
</head>
<body>
<div id="wrap"><div id="stageEl">
  <canvas id="c"></canvas>

  <div class="scene on" id="title">
    <div id="logo">K-JUMPING<small>널뛰기팡</small></div><div style="color:#fff;font-weight:900;font-size:19px;text-shadow:0 2px 3px rgba(0,0,0,.45);margin-bottom:-8px;">하늘 끝까지, 더 높이!</div>
    <div id="best-title">최고 기록: <span id="bestNum">0</span>m</div>
    <button class="btn" id="startBtn">시작하기</button>
  </div>

  <div class="scene" id="game">
    <div id="hud">
      <div id="hearts">❤️❤️❤️</div>
      <div id="hStat">
        <div class="wood">⭐ <span id="gStar">0</span></div>
        <div class="wood">💎 <span id="gGem">0</span></div>
        <button class="wood" id="pauseBtn" aria-label="일시정지">Ⅱ</button>
      </div>
    </div>
    <div id="regionBadge"><b id="regionName">하늘마을</b><span id="regionSub">현재 구간 · 0m</span></div>
    <div id="depth">0 m</div>
    <div id="judge"></div>
    <div id="progressStrip">
      <div id="progressLine"><div id="progressFill"></div></div>
      <div class="mile m0 active"><i></i><em>0m</em></div>
      <div class="mile m1"><i></i><em>100m</em></div>
      <div class="mile m2"><i></i><em>250m</em></div>
      <div class="mile m3"><i></i><em>500m</em></div>
      <div class="mile m4"><i></i><em>1000m</em></div>
    </div>
    <div id="pauseOverlay"><div id="pauseCard"><h2>잠시 쉬어가기</h2><button class="btn" id="resumeBtn">계속하기</button><button class="btn" id="pauseRetryBtn">다시 시작</button></div></div>
  </div>

  <div class="scene" id="result">
    <div id="resCard">
      <h2 id="resTitle">기록!</h2>
      <div id="resM">0</div>
      <div style="font-size:14px;margin-bottom:10px;">미터</div>
      <div class="line"><span>⭐ 별</span><b id="resStar">0</b></div>
      <div class="line"><span>💎 보석</span><b id="resGem">0</b></div>
    </div>
    <button class="btn" id="retryBtn">다시 하기</button>
  </div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),stageEl=$('stageEl');

const ASSETS={ player:'assets/player_idle.png', partner:'assets/partner_idle.png' };
const imgCache={};
function getImg(u){if(!u)return null;if(imgCache[u])return imgCache[u];const im=new Image();im.src=u;imgCache[u]=im;return im;}

let W,H,DPR;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  const aspect=9/16;let w=innerWidth,h=innerHeight;
  if(w/h>aspect)w=h*aspect; else h=w/aspect;
  stageEl.style.width=w+'px';stageEl.style.height=h+'px';
  W=w;H=h;cv.style.width=w+'px';cv.style.height=h+'px';cv.width=w*DPR;cv.height=h*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,100));

const scenes=['title','game','result'];
let current='title';
function show(name){scenes.forEach(s=>$(s).classList.toggle('on',s===name));current=name;}

let best=+(localStorage.getItem('kjump_best_m')||0);

const PPM=()=>H*0.085;
  const PHYS={gravity:()=>H*1.72,launch:()=>-H*1.42,airMax:()=>H*.95,cameraDead:()=>H*.24,cameraFollow:6.5,landingTolerance:()=>H*.13};
let G={};
const REGIONS=[
  {max:100,name:'하늘마을',sub:'따뜻한 봄 하늘'},
  {max:250,name:'구름마을',sub:'구름 위로 더 높이'},
  {max:400,name:'노을하늘',sub:'붉게 물드는 하늘'},
  {max:600,name:'달빛하늘',sub:'달빛이 비추는 밤'},
  {max:1000,name:'별의 하늘',sub:'별빛을 따라 점프'},
  {max:Infinity,name:'천상계',sub:'하늘 끝까지 도전'}
];
function getRegion(m){return REGIONS.find(r=>m<r.max)||REGIONS[REGIONS.length-1];}
function updateRegion(){
  const r=getRegion(G.curM);
  $('regionName').textContent=r.name; $('regionSub').textContent=`현재 구간 · ${G.curM}m`;
  const points=[0,100,250,500,1000];
  const max=1000; const pct=Math.min(100,(G.curM/max)*100);
  $('progressFill').style.width=pct+'%';
  document.querySelectorAll('.mile').forEach((el,i)=>el.classList.toggle('active',G.curM>=points[i]));
}
let board,player,items,rocks,floats,petals;

function startGame(){
  show('game');
  if(!W||!H)resize();
  G={cam:0,curM:0,star:0,gem:0,hearts:3,over:false}; paused=false; $('pauseOverlay').classList.remove('on');
  board={cx:W*0.5,y:H*0.72,w:W*0.78,tilt:0,gaugePhase:0};
  player={x:0,y:0,vy:0,r:W*0.12,onBoard:true};
  player.x=board.cx+board.w*0.42*0.8;
  player.y=board.y-player.r*0.5;
  items=[];rocks=[];floats=[];particles=[];shake=0;
  petals=Array.from({length:14},()=>({x:Math.random()*W,y:Math.random()*H,s:2+Math.random()*3,vy:.4+Math.random(),vx:(Math.random()-.5)*.6}));
  spawnAhead(-H*0.4);
  updateHud();
}

function spawnAhead(fromY){
  let y=fromY;
  for(let seg=0;seg<14;seg++){
    y-=H*0.22+Math.random()*H*0.14;
    const n=4+Math.floor(Math.random()*3);
    const shape=Math.floor(Math.random()*3);
    const baseX=W*(0.2+Math.random()*0.6), spanX=W*0.45*(Math.random()<.5?1:-1);
    for(let i=0;i<n;i++){
      const t=i/(n-1);let ox,oy;
      if(shape===0){ox=baseX+spanX*(t-0.5);oy=-Math.sin(t*Math.PI)*H*0.06;}
      else if(shape===1){ox=baseX+spanX*t;oy=-t*H*0.06;}
      else{ox=baseX+spanX*(t-0.5);oy=Math.sin(t*Math.PI*2)*H*0.03;}
      const type=(i===Math.floor(n/2)&&Math.random()<0.35)?'gem':'star';
      items.push({wx:Math.max(30,Math.min(W-30,ox)),wy:y+oy,type,got:false});
    }
    if(Math.random()<0.3)rocks.push({wx:Math.random()<.5?-40:W+40,wy:y-H*0.05,vx:(Math.random()*.5+.3)*(Math.random()<.5?1:-1),r:W*0.065});
  }
}

function tapGame(){
  if(current!=='game'||G.over||!player.onBoard)return;
  const q=Math.max(0,Math.min(1,board.gaugeVal||0));
  let power,label,col;
  if(q>0.8){power=1.0;label='PERFECT!';col='#ff4d6d';}
  else if(q>0.5){power=0.7;label='GOOD';col='#ffb703';}
  else{power=0.45;label='OK';col='#8ecae6';}
  player.onBoard=false;
  player.vy=-(H*0.030)*(0.7+power*0.6);
  G.lastJudge={label,col};
}
let tsx=null;
let paused=false;
function down(e){if(current!=='game'||paused)return;e.preventDefault();const t=e.touches?e.touches[0]:e;tsx=t.clientX;tapGame();}
function mv(e){if(current!=='game'||G.over||paused||player.onBoard||tsx==null)return;const t=e.touches?e.touches[0]:e,dx=t.clientX-tsx;tsx=t.clientX;player.x=Math.max(player.r,Math.min(W-player.r,player.x+dx*0.95));}
function up(){tsx=null;}
const gameScene=$('game');
gameScene.addEventListener('touchstart',down,{passive:false});
gameScene.addEventListener('touchmove',mv,{passive:false});
gameScene.addEventListener('touchend',up);
gameScene.addEventListener('mousedown',down);gameScene.addEventListener('mousemove',e=>{if(e.buttons)mv(e);});addEventListener('mouseup',up);
addEventListener('deviceorientation',e=>{if(current==='game'&&!G.over&&!paused&&!player.onBoard&&e.gamma!=null)player.x=Math.max(player.r,Math.min(W-player.r,player.x+e.gamma*0.14));});

function addFloat(x,y,t,c){floats.push({x,y,txt:t,col:c,life:1});}
function updateHud(){
  $('gStar').textContent=G.star;$('gGem').textContent=G.gem;
  $('hearts').textContent='❤️'.repeat(G.hearts)+'🤍'.repeat(3-G.hearts);
  $('depth').textContent=G.curM+' m'; updateRegion();
}

let squash=0;
let particles=[];   // 먼지·반짝임 파티클
let shake=0;         // 화면 흔들림 강도
function spawnDust(x,y,n,power){
  for(let i=0;i<n;i++){
    const a=Math.PI+Math.random()*Math.PI;   // 위쪽 반원으로 퍼짐
    const sp=(0.5+Math.random()*1.5)*power;
    particles.push({x,y,vx:Math.cos(a)*sp*3,vy:Math.sin(a)*sp*3,life:1,type:'dust',size:3+Math.random()*4});
  }
}
function spawnSparkle(x,y,color){
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2;
    particles.push({x,y,vx:Math.cos(a)*2,vy:Math.sin(a)*2-1,life:1,type:'sparkle',color,size:2+Math.random()*2});
  }
}
function updateParticles(){
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=p.type==='dust'?0.035:0.045;});
  particles=particles.filter(p=>p.life>0);
  if(shake>0)shake*=0.85; if(shake<0.05)shake=0;
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.type==='dust'){ctx.fillStyle='#d8c9a8';ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,7);ctx.fill();}
    else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}
  });
  ctx.globalAlpha=1;
}
function updateGame(){
  if(current!=='game'||G.over||paused)return;
  const halfW=board.w/2;
  if(player.onBoard){
    board.gaugePhase+=0.045;
    board.gaugeVal=(Math.sin(board.gaugePhase-Math.PI/2)+1)/2;
    board.tilt=board.gaugeVal*0.4;
    player.x=board.cx+Math.cos(board.tilt)*halfW*0.8;
    player.y=board.y+Math.sin(board.tilt)*halfW*0.8-player.r*0.5;
    squash+=(0-squash)*0.2;
  }else{
    board.tilt+=(-0.15-board.tilt)*0.06;
    player.vy+=H*0.00072;player.y+=player.vy;
    squash=Math.max(-0.35,Math.min(0.35,-player.vy*4/H));
    const target=player.y-H*0.40;if(target<G.cam)G.cam+=(target-G.cam)*0.16;
    const m=Math.max(0,Math.floor(-G.cam/PPM()));if(m>G.curM){G.curM=m;updateHud();}

    const bw=G.cam+board.y;
    const landX=board.cx+board.w*0.42*0.8;
    board.landX=landX;board.landR=player.r*0.9;
    if(player.vy>0&&player.y+player.r>=bw-6&&player.y+player.r<=bw+player.r*1.5&&Math.abs(player.x-landX)<player.r*0.95){
      player.onBoard=true;player.vy=0;player.x=landX;board.gaugePhase=0;
      if(G.lastJudge){
        const power=G.lastJudge.label==='PERFECT!'?1.6:G.lastJudge.label==='GOOD'?1.1:0.7;
        spawnDust(landX,board.y,Math.round(6*power),power);
        shake=Math.min(1,shake+0.5*power);
        bigJudge(G.lastJudge.label,G.lastJudge.col);G.lastJudge=null;
      }
    }
    if(player.vy>0&&player.y+player.r>bw+player.r*1.5)gameOver();
    if(player.y-G.cam>H+player.r*2)gameOver();
  }
  for(const s of items){if(s.got)continue;const sy=s.wy-G.cam;if(sy<-40||sy>H+40)continue;
    if(Math.hypot(s.wx-player.x,sy-player.y)<player.r+16){s.got=true;
      if(s.type==='star'){G.star++;addFloat(s.wx,sy,'+1','#ffd166');spawnSparkle(s.wx,sy,'#ffd166');}
      else{G.gem++;addFloat(s.wx,sy,'+1','#e56bff');spawnSparkle(s.wx,sy,'#e56bff');}
      updateHud();}}
  for(const r of rocks){if(r.hit)continue;r.wx+=r.vx*(H*0.004);const ry=r.wy-G.cam;if(ry<-80||ry>H+80)continue;
    if(!player.onBoard&&Math.hypot(r.wx-player.x,ry-player.y)<player.r+r.r*0.7){r.hit=true;
      G.hearts--;updateHud();if(G.hearts<=0)gameOver();}}
  const topY=items.reduce((mn,s)=>Math.min(mn,s.wy),0);if(topY>G.cam-H*2.5)spawnAhead(topY);
  floats.forEach(f=>{f.y-=1.2;f.life-=0.02;});floats=floats.filter(f=>f.life>0);
  petals.forEach(p=>{p.y+=p.vy;p.x+=p.vx;if(p.y>H){p.y=-10;p.x=Math.random()*W;}});
  updateParticles();
}
function bigJudge(t,c){
  const j=$('judge');j.textContent=t;j.style.color=c;
  const px=player?player.x:W/2, py=player?(player.y-G.cam-player.r*2):H*0.4;
  j.style.left=(px/W*100)+'%';j.style.top=(Math.max(60,py)/H*100)+'%';
  j.style.transition='none';j.style.opacity='1';j.style.transform='translate(-50%,-50%) scale(1.8)';
  requestAnimationFrame(()=>{j.style.transition='all .6s cubic-bezier(.2,.8,.2,1)';j.style.opacity='0';j.style.transform='translate(-50%,-50%) scale(1.0)';});
}
function gameOver(){
  if(G.over)return;G.over=true;
  if(G.curM>best){best=G.curM;localStorage.setItem('kjump_best_m',best);}
  $('resTitle').textContent=G.curM>=best?'최고 기록!':'기록';
  $('resM').textContent=G.curM;$('resStar').textContent=G.star;$('resGem').textContent=G.gem;
  show('result');
}

function skyColor(m){
  const stops=[
    [0,   [74,163,239],[143,208,255],[223,247,255]],
    [150, [255,153,102],[255,204,153],[255,236,214]],
    [350, [30,20,70],[70,40,120],[130,90,180]],
    [600, [5,5,20],[10,10,40],[20,20,60]],
  ];
  let lo=stops[0],hi=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){if(m>=stops[i][0]&&m<=stops[i+1][0]){lo=stops[i];hi=stops[i+1];break;}}
  if(m>=stops[stops.length-1][0])lo=hi=stops[stops.length-1];
  const t=hi[0]===lo[0]?0:Math.max(0,Math.min(1,(m-lo[0])/(hi[0]-lo[0])));
  const mix=(a,b)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return [mix(lo[1],hi[1]),mix(lo[2],hi[2]),mix(lo[3],hi[3])];
}
function drawBG(){
  const [c1,c2,c3]=skyColor(G.curM||0);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${c1})`);g.addColorStop(.5,`rgb(${c2})`);g.addColorStop(1,`rgb(${c3})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(G.curM>300){
    ctx.fillStyle=`rgba(255,255,255,${Math.min(1,(G.curM-300)/200)})`;
    for(let i=0;i<30;i++){const sx=(i*137+G.cam*0.1)%W,sy=(i*197)%H;ctx.beginPath();ctx.arc(sx,sy,1.5,0,7);ctx.fill();}
  }
  // distant floating islands / Korean silhouettes
  const night=G.curM>380;
  ctx.save(); ctx.globalAlpha=.28;
  for(let i=0;i<7;i++){
    const ix=(i*171+Math.sin(i*2.3)*60)%W;
    const iy=((i*119-G.cam*.18)%(H*1.8)+H*1.8)%(H*1.8)-H*.2;
    ctx.fillStyle=night?'#27365f':'#477d8a';
    ctx.beginPath();ctx.ellipse(ix,iy,W*.09,H*.018,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(ix-W*.065,iy);ctx.lineTo(ix+W*.065,iy);ctx.lineTo(ix+W*.025,iy+H*.065);ctx.lineTo(ix-W*.03,iy+H*.08);ctx.closePath();ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<6;i++){const cy=((i*H*0.6-G.cam*0.4)%(H*2.2)+H*2.2)%(H*2.2)-H*0.5;cloud((i*151)%W,cy,W*0.15);}
}
function cloud(x,y,r){ctx.beginPath();ctx.arc(x,y,r*.6,0,7);ctx.arc(x+r*.5,y+4,r*.5,0,7);ctx.arc(x-r*.5,y+4,r*.45,0,7);ctx.arc(x,y+r*.3,r*.6,0,7);ctx.fill();}

function drawStar(x,y,r,c){ctx.save();ctx.translate(x,y);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=8;ctx.beginPath();for(let i=0;i<5;i++){ctx.lineTo(Math.cos((18+i*72)/180*Math.PI)*r,-Math.sin((18+i*72)/180*Math.PI)*r);ctx.lineTo(Math.cos((54+i*72)/180*Math.PI)*r*.45,-Math.sin((54+i*72)/180*Math.PI)*r*.45);}ctx.closePath();ctx.fill();ctx.restore();}
function drawGem(x,y,r){ctx.save();ctx.translate(x,y);ctx.fillStyle='#39b7ff';ctx.strokeStyle='#bfeaff';ctx.lineWidth=2;ctx.shadowColor='#39b7ff';ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.8,-r*.2);ctx.lineTo(r*.5,r);ctx.lineTo(-r*.5,r);ctx.lineTo(-r*.8,-r*.2);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
function drawRock(x,y,r){ctx.save();ctx.translate(x,y);ctx.fillStyle='#3a2a22';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#ff7a1a';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc((i*0.6-0.9)*r*0.5,(i%2?0.4:-0.4)*r,r*.18,0,7);ctx.fill();}ctx.restore();}

function drawPlayer(px,py,r){
  const sq=1-squash,st=1+squash;
  const im=getImg(ASSETS.player);
  ctx.save();ctx.translate(px,py);ctx.scale(st,sq);
  if(im&&im.complete&&im.naturalWidth){const d=r*2.1;ctx.drawImage(im,-d/2,-d*0.82,d,d);}
  else{
    ctx.fillStyle='#fdfdfd';ctx.beginPath();ctx.arc(0,r*0.4,r*0.95,0,7);ctx.fill();
    ctx.fillStyle='#2f6fd0';ctx.beginPath();ctx.arc(0,r*0.1,r*0.85,Math.PI*0.15,Math.PI*0.85);ctx.fill();
  }
  ctx.restore();
}
function drawPartner(px,py,r){
  const im=getImg(ASSETS.partner);
  if(im&&im.complete&&im.naturalWidth){const d=r*2.4;ctx.drawImage(im,px-d/2,py-d*0.72,d,d);return;}
  ctx.save();ctx.translate(px,py);
  ctx.fillStyle='#2a4a86';ctx.beginPath();ctx.arc(0,r*0.4,r*0.9,0,7);ctx.fill();
  ctx.fillStyle='#ffe0bd';ctx.beginPath();ctx.arc(0,-r*0.5,r*0.65,0,7);ctx.fill();
  ctx.restore();
}

function drawGame(){
  ctx.save();
  if(shake>0.02){
    const sx=(Math.random()-0.5)*shake*W*0.03, sy=(Math.random()-0.5)*shake*W*0.03;
    ctx.translate(sx,sy);
  }
  drawBG();
  ctx.fillStyle='rgba(255,183,197,.85)';petals.forEach(p=>{ctx.beginPath();ctx.ellipse(p.x,p.y,p.s,p.s*0.6,0,0,7);ctx.fill();});
  for(const s of items){if(s.got)continue;const sy=s.wy-G.cam;if(sy<-30||sy>H+30)continue;if(s.type==='star')drawStar(s.wx,sy,W*0.045,'#ffd23f');else drawGem(s.wx,sy,W*0.04);}
  for(const r of rocks){if(r.hit)continue;const ry=r.wy-G.cam;if(ry<-90||ry>H+90)continue;drawRock(r.wx,ry,r.r);}

  const pivotX=board.cx,pivotY=board.y,halfW=board.w/2,tilt=board.tilt||0;
  ctx.save();
  ctx.fillStyle='#7a7f87';ctx.beginPath();ctx.moveTo(pivotX-W*0.05,pivotY+H*0.02);ctx.lineTo(pivotX+W*0.05,pivotY+H*0.02);ctx.lineTo(pivotX,pivotY-H*0.01);ctx.closePath();ctx.fill();
  ctx.translate(pivotX,pivotY);ctx.rotate(tilt);
  ctx.fillStyle='#a9743a';ctx.fillRect(-halfW,-H*0.012,board.w,H*0.024);
  ctx.strokeStyle='#6e4620';ctx.lineWidth=1.5;ctx.strokeRect(-halfW,-H*0.012,board.w,H*0.024);
  if(!player.onBoard&&board.landR){
    const zoneX=halfW*0.8*0.8,pulse=0.5+0.5*Math.sin(Date.now()/180);
    ctx.save();ctx.globalAlpha=0.35+0.35*pulse;ctx.fillStyle='#7CFC5A';
    ctx.beginPath();ctx.ellipse(zoneX,-H*0.02,board.landR*1.15,board.landR*0.4,0,0,7);ctx.fill();
    ctx.strokeStyle='#3ea832';ctx.lineWidth=3;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.ellipse(zoneX,-H*0.02,board.landR*1.15,board.landR*0.4,0,0,7);ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  const partX=pivotX-Math.cos(tilt)*halfW*0.8,partY=pivotY-Math.sin(tilt)*halfW*0.8;
  drawPartner(partX,partY-W*0.11,W*0.11);
  drawPlayer(player.x,player.y,player.r);

  ctx.textAlign='center';ctx.font='900 20px sans-serif';
  floats.forEach(f=>{ctx.globalAlpha=f.life;ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;});

  if(player.onBoard){
    const q=board.gaugeVal||0,bx=W*0.5,by=H*0.955,rr=W*0.13;
    ctx.save();ctx.lineWidth=W*0.045;ctx.lineCap='round';
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(bx,by,rr,Math.PI,0);ctx.stroke();
    const seg=[['#4aa3ef',0,.5],['#F7E85B',.5,.8],['#ff4d6d',.8,1]];
    seg.forEach(([c,a,b])=>{ctx.strokeStyle=c;ctx.beginPath();ctx.arc(bx,by,rr,Math.PI+Math.PI*a,Math.PI+Math.PI*b);ctx.stroke();});
    const ang=Math.PI+Math.PI*q;
    ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(ang)*rr,by+Math.sin(ang)*rr);ctx.stroke();
    ctx.fillStyle='#ffb733';ctx.beginPath();ctx.arc(bx,by,7,0,7);ctx.fill();
    ctx.restore();
  }
  drawParticles();
  ctx.restore();   // shake translate 닫기
}
function loop(){
  if(current==='game'){updateGame();drawGame();}
  else ctx.clearRect(0,0,W,H);
  requestAnimationFrame(loop);
}


$('pauseBtn').onclick=(e)=>{e.stopPropagation(); if(G.over)return; paused=true; $('pauseOverlay').classList.add('on');};
$('resumeBtn').onclick=()=>{paused=false; $('pauseOverlay').classList.remove('on');};
$('pauseRetryBtn').onclick=()=>{paused=false; $('pauseOverlay').classList.remove('on'); startGame();};

$('startBtn').onclick=()=>{
  if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{});
  startGame();
};
$('retryBtn').onclick=startGame;

resize();$('bestNum').textContent=best;show('title');requestAnimationFrame(loop);
</script>
</body>
</html>
