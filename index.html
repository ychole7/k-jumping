<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>널뛰기팡 V79</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dff5ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
#game{position:relative;width:min(100vw,480px);height:100vh;margin:auto;overflow:hidden;background:linear-gradient(#86d9ff,#eafaff 68%,#f1ddb0)}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
.ui{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.pill{background:#ffffffdf;border-radius:20px;padding:8px 13px;color:#38586a;font-weight:900;font-size:13px}
.logo{font-size:20px;font-weight:1000;color:#31586c;text-shadow:0 2px #fff}
#state{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:#315b70ed;color:white;border-radius:20px;padding:8px 15px;font-size:13px;font-weight:900;white-space:nowrap;pointer-events:none}
#hint{position:absolute;bottom:184px;left:50%;transform:translateX(-50%);color:white;font-size:15px;font-weight:1000;text-shadow:0 2px 4px #315b70;white-space:nowrap;pointer-events:none}
#tap{position:absolute;z-index:10;left:50%;bottom:105px;transform:translateX(-50%);width:118px;height:62px;border:0;border-radius:32px;background:white;color:#315b70;font-size:20px;font-weight:1000;box-shadow:0 8px 22px #315b7040;cursor:pointer;touch-action:manipulation}
#tap:active{transform:translateX(-50%) scale(.92);background:#ffe9a8}
#msg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;color:#fff;font-size:35px;font-weight:1000;text-shadow:0 3px #55788a,0 8px 20px #315b7050;transition:.12s;pointer-events:none}
#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#pause{position:absolute;z-index:12;top:58px;left:14px;width:42px;height:42px;border:0;border-radius:50%;background:#ffffffdf;color:#315b70;font-size:18px;font-weight:1000;box-shadow:0 5px 15px #315b7030;cursor:pointer}#pause:active{transform:scale(.92)}
#overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#315b7038;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.15s}
#overlay.show{opacity:1;pointer-events:auto}
.card{width:78%;padding:26px 22px;border-radius:24px;background:#fffffff2;text-align:center;box-shadow:0 18px 50px #315b7040}.card h2{margin:0 0 8px;color:#315b70;font-size:25px}.card p{margin:0 0 18px;color:#587180;font-weight:800;font-size:14px}.card button{border:0;border-radius:18px;padding:13px 28px;background:#315b70;color:#fff;font-size:16px;font-weight:1000;cursor:pointer}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="ui"><div class="pill">STAGE <b id="stage">1</b></div><div class="pill">목표 <b id="stageTarget">80</b>m</div><div class="pill">높이 <b id="score">0</b>m</div><div class="pill">COMBO <b id="combo">0</b></div></div>
<div id="comboFx">>상대 ↓ 내려오는 중</div>
<div id="state" style="position:absolute;top:76px;left:50%;transform:translateX(-50%);background:#315b70ed;color:white;border-radius:20px;padding:8px 15px;font-size:13px;font-weight:900;white-space:nowrap;pointer-events:none"></div><div id="hint">상대가 내려오면 TAP!</div>
<div id="powerWrap" style="position:absolute;left:50%;bottom:174px;transform:translateX(-50%);width:250px;pointer-events:none">
<div style="display:flex;justify-content:space-between;color:white;font-size:11px;font-weight:1000;text-shadow:0 2px 4px #315b70;margin-bottom:5px"><span>약하게</span><b id="powerText">힘 조절</b><span>강하게</span></div>
<div id="powerBar" style="position:relative;width:100%;height:14px;border-radius:9px;background:#ffffff70;box-shadow:0 2px 8px #315b7030;overflow:hidden">
<div id="powerGood" style="position:absolute;left:38%;width:24%;top:0;bottom:0;background:#fff9b0;border-radius:8px"></div><div id="powerPerfect" style="position:absolute;left:47%;width:6%;top:-2px;bottom:-2px;background:#fff;border-radius:8px;opacity:.9"></div>
<div id="powerNeedle" style="position:absolute;top:-4px;left:50%;width:6px;height:22px;border-radius:5px;background:white;box-shadow:0 2px 6px #315b7060;transform:translateX(-50%)"></div>
</div></div>
<div id="milestone" style="position:absolute;top:58px;right:14px;padding:5px 9px;border-radius:14px;background:#ffffffb8;color:#315b70;font-size:11px;font-weight:900;pointer-events:none">다음 목표 10m</div>
<button id="pause" aria-label="일시정지">Ⅱ</button>
<div id="comboStreak" style="position:absolute;top:108px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:1000;color:#fff;text-shadow:0 2px 5px #315b70;opacity:0;transition:.15s;pointer-events:none"></div><button id="tap">TAP</button>
<div id="msg"></div>
<div id="overlay"><div class="card"><h2 id="overlayTitle">일시정지</h2><p id="overlayText">게임을 잠시 멈췄어요.</p><button id="resume">계속하기</button></div></div>
</div>
<div id="stageClear" class="overlay"><div class="panel"><div id="clearTitle" style="font-size:28px;font-weight:1000;margin-bottom:8px">STAGE CLEAR!</div><div style="font-size:18px;margin-bottom:18px">최고 높이 <b id="clearScore">0m</b></div><button id="nextStage" style="padding:14px 28px;border:0;border-radius:14px;font-weight:1000;font-size:18px">NEXT STAGE</button></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,D;
// Lightweight physics layer: centralized motion/collision values.
const PHYSICS={gravity:1500, playerLaunch:-930, partnerLaunch:-610, playerFallGravity:1500, groundOffset:40, landingTolerance:16, minRebound:520, maxRebound:820, seesawSpring:7.5, seesawDamp:8.5,
  plankResponse:.00034, maxPlankAngle:.24};
const game={
 mode:'ready',
 readyT:3,
 phase:'partnerFall',
 t:0,
 score:0,best:0,combo:0,worldScroll:0,cameraY:0, stage:1, stageTarget:80, stageCleared:false,
 plank:{x:0,y:0,len:0,ang:0},
 player:{x:0,y:0,vy:0},
 partner:{x:0,y:0,vy:0},
 shake:0,
 plankVel:0,
 impact:0, impactSide:0, impactPulse:0, landingFlash:0, flightTrail:[],
 slowMo:0, slowMoTarget:10, slowMoTriggered:false, powerT:0, power:1, powerResult:'', powerFlash:0, lastGrade:'', launchBoost:1, squash:0, risk:0, lives:3, maxLives:3, riskFlash:0, comboPulse:0, apexT:0, bonusItems:[], bonusPattern:0, courseNo:0, collectStreak:0, collectStreakT:0, bonusScore:0, peakHeight:0, flightCollected:0, totalCollected:0, bonusSpawnT:0, bonusFlash:0, bonusText:'', hazards:[], doubleReady:false, doubleWindow:0, doubleCount:0, tripleReady:false, tripleWindow:0, fever:false, feverT:0, feverFlash:0, airX:0, airVX:0, airInput:0, landingAssist:0, landingGrade:'', landingFlashT:0, landingLockT:0, deathT:0, respawnT:0, safeLandingFlashT:0
};
let particles=[];

function resize(){
 W=canvas.clientWidth;H=canvas.clientHeight;D=Math.min(devicePixelRatio||1,2);
 canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 game.plank.x=W/2;game.plank.y=H*.70;game.plank.len=W*.70;
 resetPositions();
}
function L(){return game.plank.x-game.plank.len/2+28}
function R(){return game.plank.x+game.plank.len/2-28}
// Height of each standing point on the rotated plank.
function plankYAt(x){return game.plank.y+(x-game.plank.x)*Math.sin(game.plank.ang)}
function standY(x){return plankYAt(x)-PHYSICS.groundOffset}
function updateStageUI(){
 document.getElementById('stage').textContent=game.stage;
 document.getElementById('stageTarget').textContent=game.stageTarget;
 const m=document.getElementById('milestone'); if(m)m.textContent='목표 '+game.stageTarget+'m';
}
function resetPositions(){
 game.plankVel=0;
 game.impact=0; game.impactSide=0;
 game.slowMo=0;game.slowMoTarget=10;game.slowMoTriggered=false; game.risk=0;game.riskFlash=0; game.powerT=0; game.power=1; game.powerResult=''; game.powerFlash=0; game.lastGrade=''; game.launchBoost=1; game.squash=0;
 game.stageCleared=false; resetBonuses(); game.doubleReady=false; game.doubleWindow=0; game.doubleCount=0; game.tripleReady=false; game.tripleWindow=0; game.fever=false; game.feverT=0; game.feverFlash=0; updateStageUI();
 game.player.x=R();game.player.y=standY(R());game.player.vy=0;game.player.lastImpactSpeed=0;
 game.partner.x=L();game.partner.y=standY(L());game.partner.vy=0;game.partner.lastImpactSpeed=0;
}

function integrate(body, dt){
  body.vy += PHYSICS.gravity * dt;
  body.y += body.vy * dt;
}
function land(body){
  // A landing can only happen over the physical plank.
  // Outside the plank width, the player cannot "land" in mid-air.
  const half=game.plank.len/2;
  const dxFromCenter=body.x-game.plank.x;
  const overPlank=Math.abs(dxFromCenter)<=half+10;
  const groundY=standY(Math.max(game.plank.x-half,Math.min(game.plank.x+half,body.x)));
  const crossed=body.y>=groundY-PHYSICS.landingTolerance;

  if(body.vy>0 && crossed && overPlank){
    const impactSpeed=body.vy;
    body.y=groundY;
    body.vy=0;
    body.lastImpactSpeed=impactSpeed;
    return true;
  }
  return false;
}

function setState(a,b){document.getElementById('state').textContent=a;document.getElementById('hint').textContent=b}
function pop(t){
 const e=document.getElementById('msg');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');
 clearTimeout(pop.tm);pop.tm=setTimeout(()=>e.classList.remove('show'),420);
}
function burst(x,y,side=0){
 for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,s=80+Math.random()*220;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,r:2+Math.random()*3})}
 game.impact=.18; game.impactSide=side; game.impactPulse=1; game.landingFlash=.22;
}




function buildCoinTrail(points, type='star'){
  const out=[];
  for(let s=0;s<points.length-1;s++){
    const a=points[s], b=points[s+1];
    const dx=b[0]-a[0], dy=b[1]-a[1];
    const dist=Math.hypot(dx,dy);
    const count=Math.max(2,Math.floor(dist/0.075));
    for(let i=0;i<count;i++){
      const t=i/count;
      const x=a[0]+dx*t;
      const y=a[1]+dy*t;
      out.push([x,y,type]);
    }
  }
  const last=points[points.length-1];
  out.push([last[0],last[1],type]);
  return out;
}

function spawnAirCourse(){
  game.courseNo=(game.courseNo||0)+1;
  game.bonusItems.length=0;

  // Hand-authored routes. Dense enough to feel like a continuous runner trail,
  // but with enough spacing for the player to make meaningful left/right moves.
  const routes=[
    [[.78,.56],[.68,.53],[.56,.49],[.44,.45],[.34,.39],[.28,.32],[.38,.27],[.52,.23],[.68,.20]],
    [[.72,.55],[.61,.51],[.48,.48],[.34,.43],[.25,.36],[.32,.30],[.48,.28],[.64,.25],[.76,.20]],
    [[.78,.55],[.70,.48],[.57,.44],[.42,.46],[.29,.40],[.20,.33],[.30,.28],[.47,.24],[.64,.22]]
  ];

  const route=routes[(game.courseNo-1)%routes.length];
  const dense=buildCoinTrail(route,'star');

  // Upgrade selected points to gems so the route has decisions.
  dense.forEach((p,i)=>{
    const gem=(i===Math.floor(dense.length*.35) || i===Math.floor(dense.length*.72));
    game.bonusItems.push({
      x:Math.max(38,Math.min(W-38,p[0]*W)),
      y:Math.max(H*.17,Math.min(H*.60,p[1]*H)),
      type:gem?'gem':'star',
      life:20, spin:i*.32, got:false, course:true, index:i
    });
  });

  game.bonusSpawnT=0;
  game.bonusPattern=(game.bonusPattern||0)+1;
}


function spawnBonus(){
  // Keep bonuses in a readable band around the player's airborne path.
  const side=Math.random()<.5?-1:1;
  const x=Math.max(42,Math.min(W-42,W/2+side*(45+Math.random()*Math.max(35,W*.28))));
  const y=Math.max(H*.18,Math.min(H*.55,game.plank.y-90-Math.random()*Math.min(250,Math.max(80,game.score*1.8))));
  const type=Math.random()<.22?'gem':'star';
  game.bonusItems.push({x,y,type,life:7,spin:Math.random()*Math.PI*2,got:false});
}
function spawnHazard(){
  const x=Math.max(38,Math.min(W-38,W/2+(Math.random()<.5?-1:1)*(55+Math.random()*Math.max(30,W*.30))));
  const y=Math.max(H*.20,Math.min(H*.52,game.plank.y-100-Math.random()*Math.min(220,Math.max(90,game.score*1.5))));
  game.hazards.push({x,y,life:6,spin:Math.random()*6,hit:false});
}

function drawBonusItems(){
  for(const b of game.bonusItems){
    if(b.got) continue;
    const a=Math.min(1,b.life<1?b.life:1);
    ctx.save(); ctx.translate(b.x,b.y);
    ctx.globalAlpha=a; ctx.shadowColor='rgba(255,220,60,.8)'; ctx.shadowBlur=16;
    if(b.type==='gem'){
      ctx.fillStyle='#74d8ff'; ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(0,-18);ctx.lineTo(14,-5);ctx.lineTo(8,13);ctx.lineTo(-8,13);ctx.lineTo(-14,-5);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.moveTo(-5,-9);ctx.lineTo(1,-13);ctx.lineTo(-1,-2);ctx.closePath();ctx.fill();
    }else{
      ctx.fillStyle='#ffd84a';ctx.strokeStyle='#fff6b0';ctx.lineWidth=3;
      ctx.beginPath();
      for(let i=0;i<10;i++){const r=i%2===0?18:8,a2=-Math.PI/2+i*Math.PI/5,x=Math.cos(a2)*r,y=Math.sin(a2)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.closePath();ctx.fill();ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-7,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}
function drawHazards(){
  for(const z of game.hazards){
    if(z.hit) continue;
    const a=Math.min(1,z.life<1?z.life:1);
    ctx.save();ctx.translate(z.x,z.y);ctx.rotate(z.spin);ctx.globalAlpha=a;
    ctx.shadowColor='rgba(255,80,30,.9)';ctx.shadowBlur=20;
    ctx.fillStyle='#ff7447';ctx.strokeStyle='#fff0b0';ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(0,-20);ctx.lineTo(10,-7);ctx.lineTo(18,1);ctx.lineTo(7,6);ctx.lineTo(3,19);ctx.lineTo(-7,8);ctx.lineTo(-18,9);ctx.lineTo(-10,-2);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe06a';ctx.beginPath();ctx.arc(-3,-5,5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=a*.7;ctx.strokeStyle='#ffb04d';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(-13,9);ctx.lineTo(-29,21);ctx.stroke();
    ctx.restore();
  }
}

function resetBonuses(){
  game.bonusItems.length=0;
  game.bonusScore=0;
  game.bonusSpawnT=0;
  game.bonusFlash=0;
  game.bonusText=''; game.hazards.length=0;
}
function checkBonusCatch(body, drawY){
  for(const b of game.bonusItems){
    if(b.got) continue;
    const dx=body.x-b.x, dy=drawY-b.y;
    if(dx*dx+dy*dy<34*34){
      b.got=true;
      const gain=b.type==='gem'?30:10;
      game.bonusScore+=gain;
      game.score+=gain;
      game.flightCollected=(game.flightCollected||0)+1;
      game.totalCollected=(game.totalCollected||0)+1;
      game.collectStreak=(game.collectStreak||0)+1; game.collectStreakT=1.1;
      if(game.collectStreak%5===0){ game.score+=5; pop('⭐ COLLECTION x'+game.collectStreak+'  +5'); }
      game.bonusFlash=.45;
      game.bonusText=(b.type==='gem'?'💎 +30':'⭐ +10');
      pop(game.bonusText);
      game.comboPulse=.35;
      document.getElementById('score').textContent=Math.floor(game.score);
    }
  }
}

function checkHazardHit(body,drawY){
  for(const z of game.hazards){
    if(z.hit) continue;
    const dx=body.x-z.x,dy=drawY-z.y;
    if(dx*dx+dy*dy<31*31){
      z.hit=true; game.combo=0; game.riskFlash=.7;
      pop('☄️ COMBO BREAK!');
      document.getElementById('combo').textContent='0';
    }
  }
}

function setAirDirect(clientX){
  if(game.phase!=='playerUp') return;
  const rect=canvas.getBoundingClientRect();
  const nx=(clientX-rect.left)/rect.width;
  const targetX=Math.max(28,Math.min(W-28,nx*W));
  game.airX=targetX;
  game.player.x=targetX;
  game.airVX=0;
}
function setAirInput(clientX){
  if(game.mode!=='playing' || game.phase!=='playerUp') return;
  const rect=canvas.getBoundingClientRect();
  const nx=(clientX-rect.left)/rect.width;
  game.airInput=Math.max(-1,Math.min(1,(nx-.5)*2));
}
function clearAirInput(){
  game.airInput=0;
}
canvas.addEventListener('pointermove',e=>{ if(game.phase==='playerUp') setAirDirect(e.clientX); else setAirInput(e.clientX); });
canvas.addEventListener('pointerdown',e=>{
  if(game.phase==='playerUp') setAirInput(e.clientX);
});
canvas.addEventListener('pointerup',clearAirInput);
canvas.addEventListener('pointercancel',clearAirInput);
canvas.addEventListener('pointerleave',clearAirInput);


function landingBounce(grade){
  // Small visual recoil: the plank reacts first, then partner is launched.
  game.plank.ang += grade==='PERFECT' ? -0.075 : grade==='GOOD' ? -0.05 : grade==='EDGE' ? -0.03 : 0.02;
  game.landingFlashT = Math.max(game.landingFlashT||0, grade==='PERFECT' ? .34 : .22);
}


function loseLife(){
  game.lives=Math.max(0,(game.lives||0)-1);
  game.lifeLostT=.8;
  game.deathT=.65;
  game.respawnT=.65;
  game.landingFlashT=.28;
  game.landingGrade='MISS';
  game.airInput=0;
  game.airVX=0;
  game.combo=0;
  game.doubleReady=false;
  game.tripleReady=false;
  game.fever=false;
  pop(game.lives>0 ? '💨 착지 실패! 목숨 -1' : '💀 GAME OVER');
}


function showLandingResult(){
  const g=game.landingGrade;
  game.landingResultT = g==='PERFECT' ? .72 : g==='GOOD' ? .58 : g==='EDGE' ? .52 : .68;
  if(g==='PERFECT') pop('🎯 PERFECT!');
  else if(g==='GOOD') pop('👍 GOOD!');
  else if(g==='EDGE') pop('⚠️ EDGE!');
  else pop((game.lives||0)>0 ? '💨 MISS!' : '💀 GAME OVER');
}

function resolveLanding(){
  const target=R();
  const dx=Math.abs(game.player.x-target);

  // The actual playable landing zone is the central 164px of the seesaw.
  // PERFECT is the central 76px, GOOD is the remaining safe area.
  if(dx<=38){
    game.landingGrade='PERFECT';
    landingBounce('PERFECT');
    game.landingFlashT=.42;
    game.combo=Math.min(99,(game.combo||0)+1);
    game.score=(game.score||0)+5;
    pop('🎯 PERFECT LANDING!');
  }else if(dx<=82){
    game.landingGrade='GOOD';
    landingBounce('GOOD');
    game.landingFlashT=.30;
    game.combo=Math.min(99,(game.combo||0)+1);
    game.score=(game.score||0)+2;
    pop('👍 GOOD LANDING!');
  }else{
    game.landingGrade='MISS';
    game.landingFlashT=.34;
    loseLife();
    // Do not continue the normal landing/rebound sequence after a miss.
    game.phase=(game.lives||0)>0 ? 'partnerReady' : 'gameOver';
    game.player.vy=0;
    game.airVX=0;
    game.airInput=0;
    game.player.y=standY(game.player.x);
    return;
  }

  // Successful landing: gently center the player, then launch partner.
  const assist=Math.max(0,1-dx/82);
  game.player.x += (target-game.player.x)*0.16*assist;
  game.player.y=standY(game.player.x);
  game.player.vy=0;
  game.airVX=0;
  game.airInput=0;

  // Landing quality controls the next partner rebound.
  const mult=game.landingGrade==='PERFECT'?1.12:1.0;
  game.partner.vy=Math.max(PHYSICS.minRebound,Math.min(PHYSICS.maxRebound,game.partner.vy*mult || PHYSICS.partnerLaunch*-1*mult));
  game.phase='partnerUp';
}

function tap(){
  if(game.phase==='gameOver'){ if(typeof resetGame==='function') resetGame(); return; }
  if((game.lives||0)<=0){ if(typeof resetGame==='function') resetGame(); return; }
 if(game.mode!=='playing') return;
 // Only a landed partner can be tapped. This is the sole player action.
 if(game.phase!=='partnerReady') return;

 game.partner.y=standY(L());
 game.partner.vy=0;
 game.player.y=standY(R());
 game.combo++;
  if(game.tripleReady){
    game.tripleReady=false;
    game.tripleWindow=0;
    game.score+=30;
    game.comboPulse=.9;
    pop('🔥 TRIPLE +30!');
    burst(R(),game.plank.y,3);
  }else if(game.doubleReady){
    game.doubleCount++;
    game.score+=15;
    game.doubleReady=false;
    game.doubleWindow=0;
    game.comboPulse=.65;
    pop('⚡ DOUBLE +15!');
    burst(R(),game.plank.y,2);
  }

 const gaugePos=10+(game.power-.72)/.58*80;
 const difficulty=Math.min(1,Math.max(0,game.score/120));
 const centerDist=Math.abs(gaugePos-50);
 const perfectLimit=4-difficulty*2;
 const goodLimit=16-difficulty*6;
 let grade, powerMul;
 if(centerDist<=perfectLimit){ grade='PERFECT'; powerMul=1.10; }
 else if(centerDist<=goodLimit){ grade='GOOD'; powerMul=1.03; }
 else if(gaugePos<50){ grade='WEAK'; powerMul=.94; }
 else { grade='POWER'; powerMul=1.08; }
 game.powerResult=grade; game.lastGrade=grade; game.powerFlash=.55;
 game.risk = grade==='POWER' ? .85 : grade==='PERFECT' ? .15 : grade==='GOOD' ? .05 : 0;
 game.riskFlash = game.risk;
 game.launchBoost=powerMul;
 game.squash=.18; game.comboPulse=.42;
  // Combo chain: 3+ creates DOUBLE, 5+ creates the higher-value TRIPLE.
  // An active reward is consumed first; a new opportunity is prepared afterward.
  if(!game.tripleReady && !game.doubleReady){
    if(game.combo>=5){
      game.tripleReady=true;
      game.tripleWindow=2.2;
      pop('🔥 TRIPLE READY!');
    }else if(game.combo>=3){
      game.doubleReady=true;
      game.doubleWindow=2.2;
      game.doubleCount=0;
      pop('⚡ DOUBLE READY!');
    }
  }
  // Seven clean beats unlock a short FEVER scoring phase.
  if(game.combo>=7 && !game.fever){
    game.fever=true;
    game.feverT=5;
    game.feverFlash=.9;
    pop('🔥 FEVER!');
    game.comboPulse=.9;
  }
 if(game.fever){
    game.score+=5;
    game.feverFlash=.45;
  }
 game.airX=game.player.x; game.airVX=0;
 game.player.vy=PHYSICS.playerLaunch*game.power*powerMul*(1+Math.min(game.combo,10)*.035);
 const gradeTilt=grade==='PERFECT'?.19:grade==='GOOD'?.16:grade==='POWER'?.21:.12;
 const gradeKick=grade==='PERFECT'?1.18:grade==='GOOD'?1.05:grade==='POWER'?1.28:.82;
 game.plank.ang=Math.min(PHYSICS.maxPlankAngle,gradeTilt+game.combo*.003);
 // Risk/reward: stronger shots create more score potential but a tougher next beat.
 if(grade==='PERFECT') game.score += 1.5;
 if(grade==='POWER') game.score += 3;
 else if(grade==='GOOD') game.score += .5;
 game.plankVel=.95*gradeKick;
 game.shake=7;
 burst(L(),game.plank.y);
 pop(game.powerResult==='PERFECT'?'PERFECT!':game.powerResult==='GOOD'?'GOOD!':game.powerResult==='POWER'?'POWER!':'WEAK!');

 document.getElementById('score').textContent=Math.floor(game.score);
 document.getElementById('combo').textContent=game.combo;
 const cs=document.getElementById('comboStreak'); if(cs){
   cs.textContent=game.fever?'🔥 FEVER  +5 / TAP':game.combo>=3?'🔥 '+game.combo+' COMBO!':game.combo===2?'2 COMBO!':'';
   cs.style.opacity=(game.combo>=2||game.fever)?'1':'0';
   cs.style.transform='translateX(-50%) scale('+(1+(game.comboPulse>0?game.comboPulse*.12:0))+')';
  }

 game.phase='playerUp'; game.flightCollected=0; game.collectStreak=0; game.collectStreakT=0; game.peakHeight=0; game.airX=game.player.x; game.airVX=0;
 spawnAirCourse();
 game.t=0;
 setState('PLAYER ↑ 팡!','높이 올라가는 중');
}

}

function updateLandingWarning(dt){
  if(game.phase!=='playerUp' || game.player.vy<=120){
    game.landingWarnT=0;
    return;
  }
  const target=R();
  const dx=Math.abs(game.player.x-target);
  const half=game.plank.len/2;
  const y=standY(Math.max(game.plank.x-half,Math.min(game.plank.x+half,game.player.x)));
  const dist=y-game.player.y;
  if(dist<150){
    game.landingWarnT=.12;
  }
}

function update(dt){
  updateLandingWarning(dt);
 if(game.mode==='paused') return;
 document.getElementById('tap').style.opacity=game.mode==='playing'?'1':'0.55';
 if(game.mode==='ready'){
   game.readyT-=dt;
   const n=Math.max(1,Math.ceil(game.readyT));
   setState('준비 '+n,'곧 시작합니다');
   if(game.readyT<=0){
     game.mode='playing';
     game.t=0;
     setState('상대 ↓ 내려오는 중','상대가 내려오면 TAP!');
     pop('START!');
   }
   return;
 }
 // Brief slow-motion when the player pushes past the next 10m target.
 if(game.slowMo>0){
   game.slowMo=Math.max(0,game.slowMo-dt);
 }
 const timeScale=game.slowMo>0 ? .32 : 1;
 dt*=timeScale;
 game.shake*=.88;
 game.impact=Math.max(0,game.impact-dt); game.impactPulse=Math.max(0,game.impactPulse-dt*3); game.landingFlash=Math.max(0,game.landingFlash-dt);
  if(game.phase==='playerUp'||game.phase==='partnerUp'){
    const f=game.phase==='playerUp'?game.player:game.partner;
    game.flightTrail.push({x:f.x,y:f.y,life:.24});
    if(game.flightTrail.length>18) game.flightTrail.shift();
  }else game.flightTrail.length=0;
  if(game.phase!=='playerUp') game.airInput=0;
  for(const tr of game.flightTrail) tr.life-=dt;
  game.flightTrail=game.flightTrail.filter(tr=>tr.life>0);
 game.powerFlash=Math.max(0,game.powerFlash-dt);
 game.riskFlash=Math.max(0,game.riskFlash-dt);
  if(game.feverT>0) game.feverT=Math.max(0,game.feverT-dt);
  if(game.fever && game.feverT<=0) game.fever=false;
  game.feverFlash=Math.max(0,game.feverFlash-dt);
  game.landingFlashT=Math.max(0,game.landingFlashT-dt);
 game.squash=Math.max(0,game.squash-dt); game.comboPulse=Math.max(0,game.comboPulse-dt); game.apexT=0;
  game.bonusFlash=Math.max(0,game.bonusFlash-dt);
  if(game.doubleWindow>0) game.doubleWindow=Math.max(0,game.doubleWindow-dt);
  if(game.doubleReady && game.doubleWindow<=0){ game.doubleReady=false; game.doubleCount=0; }
  if(game.tripleWindow>0) game.tripleWindow=Math.max(0,game.tripleWindow-dt);
  if(game.tripleReady && game.tripleWindow<=0){ game.tripleReady=false; }
  game.bonusSpawnT+=dt;
  if(game.phase==='partnerUp' && game.bonusSpawnT>1.15 && game.bonusItems.filter(b=>!b.got).length<2){
    game.bonusSpawnT=0;
    spawnBonus();
  }
  if(game.phase==='playerUp' && game.score>=25 && Math.random()<.008 && game.hazards.filter(z=>!z.hit).length<1){
    spawnHazard();
  }
  for(const b of game.bonusItems){ b.life-=dt; b.spin+=dt*3.2; }
  for(const z of game.hazards){ z.life-=dt; z.spin+=dt*4; }
  game.bonusItems=game.bonusItems.filter(b=>b.life>0&&!b.got);
  game.hazards=game.hazards.filter(z=>z.life>0&&!z.hit);

 // Seesaw angle behaves like a damped spring: impact bends it, then it settles.
 game.plankVel += (-game.plank.ang*PHYSICS.seesawSpring - game.plankVel*PHYSICS.seesawDamp)*dt;
 game.plank.ang += game.plankVel*dt;
 game.plank.ang=Math.max(-PHYSICS.maxPlankAngle,Math.min(PHYSICS.maxPlankAngle,game.plank.ang));
 game.t+=dt;

 // Moving power gauge is active only while waiting for TAP.
 game.powerT += dt;
 // Difficulty ramps gently with altitude: the gauge gets faster and the
 // accurate zones become slightly narrower. The early game stays forgiving.
 const difficulty=Math.min(1,Math.max(0,game.score/120));
 const gaugeSpeed=4.2+difficulty*2.2 + game.risk*.9;
 const wave=.5+.5*Math.sin(game.powerT*gaugeSpeed);
 game.power=.72+wave*.58;
 const needle=document.getElementById('powerNeedle');
 const powerText=document.getElementById('powerText');
 if(needle){ needle.style.left=(10+wave*80)+'%'; }
 const good=document.getElementById('powerGood');
 const perfect=document.getElementById('powerPerfect');
 if(good){
   const goodW=24-difficulty*6;
   good.style.width=goodW+'%';
   good.style.left=(50-goodW/2)+'%';
 }
 if(perfect){
   const perfectW=6-difficulty*2;
   perfect.style.width=perfectW+'%';
   perfect.style.left=(50-perfectW/2)+'%';
 }
 if(powerText){
   if(game.phase==='gameOver') return;
  if(game.phase==='partnerReady') powerText.textContent=game.tripleReady?'🔥 TRIPLE 기회!':(game.doubleReady?'⚡ DOUBLE 기회!':(game.powerResult?game.powerResult+' · 다시 조준!':'지금 TAP!'));
   else powerText.textContent='힘 조절';
   powerText.style.transform=game.powerFlash>0?'scale(1.16)':'scale(1)';
   powerText.style.color=game.risk>.7?'#e05a3f':game.risk>.1?'#d18b2c':'';
   if(game.phase==='partnerReady' && game.risk>.7) powerText.textContent='POWER · 위험도 ↑';
 }

 // Camera is deliberately decoupled from gameplay coordinates.
 // The seesaw stays fixed on screen; altitude is expressed by moving the
 // background and by placing airborne characters in a safe screen band.
 if(game.phase==='playerUp'){
    const currentHeight=Math.max(0,(game.plank.y-game.player.y)*0.62);
    game.peakHeight=Math.max(game.peakHeight||0,currentHeight);

   const ascent=Math.max(0,game.plank.y-game.player.y);
   const targetScroll=Math.min(560,Math.max(0,(ascent-120)*.72));
   game.worldScroll += (targetScroll-game.worldScroll)*Math.min(1,dt*6);
   game.cameraY=0;
 }else if(game.phase==='partnerUp'){
   const rise=Math.max(0,game.plank.y-game.partner.y);
   const targetScroll=Math.min(140,Math.max(0,(rise-120)*.25));
   game.worldScroll += (targetScroll-game.worldScroll)*Math.min(1,dt*5);
   game.cameraY=0;
 }else{
   game.worldScroll += (0-game.worldScroll)*Math.min(1,dt*3);
   game.cameraY=0;
 }

 if(game.phase==='partnerFall'){
   // Partner falls ONCE, then waits. Only TAP can launch PLAYER.
   const u=Math.min(1,game.t/.95);
   const top=standY(L())-130,bottom=standY(L());
   game.partner.x=L();
   game.partner.y=top+(bottom-top)*u*u;
   game.partner.vy=(bottom-top)*2*u/.95;
   const partnerDrawY=Math.max(H*.20,Math.min(H*.62,game.plank.y-Math.max(0,game.plank.y-game.partner.y)*.62));
   checkBonusCatch(game.partner,partnerDrawY);
   checkHazardHit(game.partner,partnerDrawY);
   game.player.x=R();
   game.player.y=game.plank.y-40;
   if(game.t>=.95){
     game.partner.y=bottom;
     game.partner.vy=0;
     game.phase='partnerReady';
     game.t=0;
     setState('상대 ↓ 착지 완료','TAP 하면 PLAYER가 팡!');
   }
 }
 else if(game.phase==='partnerReady') {
   game.partner.x=L();
   game.partner.y=standY(L());
 }
 else if(game.phase==='playerUp'){
   game.player.vy += PHYSICS.playerFallGravity*dt;
   const airAccel=6500;
   const airMax=900;
   game.airVX += game.airInput*airAccel*dt;
   game.airVX *= Math.pow(.18,dt);
   game.airVX=Math.max(-airMax,Math.min(airMax,game.airVX));
   game.player.x += game.airVX*dt;
   game.player.x=Math.max(28,Math.min(W-28,game.player.x));
   game.player.y += game.player.vy*dt;

   if(game.player.vy>120){
     const dx=R()-game.player.x;
     const near=Math.max(0,Math.min(1,1-Math.abs(dx)/180));
     game.airVX += dx*0.38*near*dt;
     game.airVX *= Math.pow(.18,dt);
   }

   const playerDrawY=Math.max(H*.20,Math.min(H*.62,game.plank.y-Math.max(0,game.plank.y-game.player.y)*.62));
   checkBonusCatch(game.player,playerDrawY);
   checkHazardHit(game.player,playerDrawY);

   const oldScore=game.score;
   game.score=Math.max(game.score,(game.plank.y-game.player.y)/7);
   game.best=Math.max(game.best,game.score);
   const target=game.slowMoTarget;
   const milestone=document.getElementById('milestone');
   if(milestone)milestone.textContent='다음 목표 '+target+'m';

   // Once the player clears the target by a few meters, give a short
   // "wow" slow-motion moment, then set the next target.
   if(!game.slowMoTriggered && game.score>=target+3){
     game.slowMoTriggered=true;
     game.slowMo=.38;
     pop(target+'m 돌파!');
     game.slowMoTarget+=10;
     game.combo=Math.max(game.combo, game.combo);
   }
   if(game.score<target-2) game.slowMoTriggered=false;
   document.getElementById('score').textContent=Math.floor(game.score);

   // TEST MODE: stage target never stops the run.
   // Keep scoring, combos, bonuses and FEVER running indefinitely.
   if(!game.stageCleared && game.score>=game.stageTarget){
     game.stageCleared=true;
     setState('TEST MODE · 목표 돌파!','계속 플레이 가능');
   }

   // If the player reaches the plank height while outside the plank,
   // this is an immediate landing MISS.
   const plankHalf=game.plank.len/2;
   const outsidePlank=Math.abs(game.player.x-game.plank.x)>plankHalf+10;
   const landingPlane=standY(Math.max(game.plank.x-plankHalf,Math.min(game.plank.x+plankHalf,game.player.x)));

   if(game.player.vy>120 && game.player.y>=landingPlane-PHYSICS.landingTolerance){
     if(outsidePlank){
       game.landingGrade='MISS';
       loseLife();
       game.phase=(game.lives||0)>0?'partnerReady':'gameOver';
       game.player.vy=0;
       game.airVX=0;
       game.airInput=0;
       game.t=0;
       setState((game.lives||0)>0?'착지 실패':'GAME OVER','SAFE LANDING 영역에 착지하세요');
     }else if(land(game.player)){
       const beforePhase=game.phase;
       resolveLanding();

       // resolveLanding() owns the MISS transition. Only successful landings
       // continue into the rebound sequence.
       if(game.landingGrade!=='MISS'){
         const impactSpeed=Math.max(0, game.player.lastImpactSpeed || 0);
         const rebound=Math.max(PHYSICS.minRebound, Math.min(PHYSICS.maxRebound, impactSpeed*.38));
         const landingMul=game.landingGrade==='PERFECT'?1.12:game.landingGrade==='GOOD'?1.0:.82;
         const adjustedRebound=Math.max(PHYSICS.minRebound*.75,Math.min(PHYSICS.maxRebound,rebound*landingMul));
         game.partner.x=L();
         game.partner.y=standY(L());
         game.partner.vy=-adjustedRebound;
         game.plank.ang=-Math.min(PHYSICS.maxPlankAngle, .09 + rebound/5200);
         game.plankVel=-.65;
         game.shake=Math.min(8,4+rebound/180);
         game.phase='partnerUp';
         game.t=0;
         pop('쿵!');
         setState('상대 ↑','PLAYER 착지 → 상대 발사');
       }
     }
   }
 }
 else if(game.phase==='partnerUp'){
   game.partner.x=L();
   integrate(game.partner,dt);

   if(land(game.partner)){
     burst(L(),game.plank.y,-1);
     game.plank.ang=-.035;
     game.partner.y=standY(L());
     game.plankVel=.25;

     // IMPORTANT: stop here. The partner is now standing on the plank.
     // It must NOT jump again until the player taps.
     game.phase='partnerReady';
     game.t=0;
     setState('상대 ↓ 착지 완료','TAP 하면 PLAYER가 팡!');
     pop('착지!');
   }
 }

 for(const p of particles){
   p.x+=p.vx*dt;
   p.y+=p.vy*dt;
   p.vy+=500*dt;
   p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);
}

function drawBg(){
 const h=game.score;
 let top='#86d9ff', bottom='#eafaff';
 if(h>=10){top='#72c9f4';bottom='#e3f5ff'}
 if(h>=20){top='#69b6e8';bottom='#d9effc'}
 if(h>=30){top='#5b9ed0';bottom='#cfe7f7'}

 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,top);g.addColorStop(.68,bottom);g.addColorStop(1,'#f1ddb0');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // Only the background has altitude motion. The game objects do not.
 const alpha=h<10?.58:h<20?.72:.86;
 ctx.fillStyle=`rgba(255,255,255,${alpha})`;

 for(let i=0;i<count;i++){
   let x=(i*91+30)%W;
   let y=(i*127+80-game.worldScroll+game.cameraY*.55)%(H+160);
   if(y<0)y+=H+160;
   const sc=1+Math.min(h,40)/100;
   ctx.beginPath();
   ctx.ellipse(x,y,38*sc,12*sc,0,0,Math.PI*2);
   ctx.ellipse(x+28*sc,y+2*sc,25*sc,10*sc,0,0,Math.PI*2);
   ctx.fill();
 }

 // Distant landscape scrolls gently in the opposite direction.
 const ga=Math.max(.12,.48-h*.012);
 ctx.fillStyle=`rgba(167,215,168,${ga})`;
 ctx.save();
 ctx.translate(0,Math.min(60,game.worldScroll*.25+game.cameraY*.18));
 ctx.beginPath();
 ctx.moveTo(0,H*.72);
 for(let x=0;x<=W;x+=40)ctx.lineTo(x,H*.67+Math.sin(x*.026)*18);
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 ctx.restore();

 if(h>=20){
   ctx.fillStyle=`rgba(255,255,255,${Math.min(.14,(h-20)*.003)})`;
   ctx.fillRect(0,0,W,H);
 }
}


function drawFlightTrail(){
  if(!game.flightTrail.length) return;
  ctx.save();
  for(const tr of game.flightTrail){
    ctx.globalAlpha=Math.max(0,tr.life/.24)*.18;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(tr.x,tr.y,4+tr.life*10,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawImpactFx(){
  if(game.impactPulse<=0) return;
  const x=game.impactSide<0?L():R(), y=game.plank.y;
  ctx.save();
  const q=1-game.impactPulse;
  ctx.globalAlpha=Math.max(0,game.impactPulse*.75);
  ctx.strokeStyle='#fff7c7';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(x,y,12+q*30,Math.PI*.12,Math.PI*.88);
  ctx.stroke();
  ctx.globalAlpha=Math.max(0,game.impactPulse*.35);
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.arc(x,y,7+q*18,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

 ctx.save();
 ctx.translate(c.x,c.y);
 if(grounded) ctx.rotate(game.plank.ang);

 // Small squash/stretch makes the power judgment visibly matter.

   const v=c.vy||0;
   const speed=Math.min(1,Math.abs(v)/1100);

   if(game.squash>0){ sx=.91; sy=1.12; }
 } else if(!player && game.phase==='partnerUp'){
   const v=c.vy||0, speed=Math.min(1,Math.abs(v)/800);
   if(v<0){sx=1-.04*speed;sy=1+.06*speed;} else {sx=1+.05*speed;sy=1-.05*speed;}
 }
 ctx.scale(sx,sy);

 ctx.fillStyle='#4f5360';ctx.beginPath();ctx.roundRect(-18,8,36,25,11);ctx.fill();
 ctx.strokeStyle='#4f5360';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,25);ctx.lineTo(-12,42);ctx.moveTo(7,25);ctx.lineTo(12,42);ctx.stroke();

function drawLandingTargetFX(){
  if(game.phase!=='playerUp' || game.player.vy<=120) return;
  const cx=R(), y=game.plank.y-1;
  const dx=Math.abs(game.player.x-cx);
  const safe=dx<=82;
  const near=game.player.y > y-180;
  if(!near) return;

  ctx.save();
  const pulse=1+Math.sin(performance.now()/110)*.05;
  ctx.translate(cx,y);
  ctx.scale(pulse,pulse);

  // Target shadow directly on the plank.
  ctx.globalAlpha=safe?.28:.34;
  ctx.fillStyle=safe?'#fff':'#ff5d55';
  ctx.beginPath();
  ctx.ellipse(0,3,82,10,0,0,Math.PI*2);
  ctx.fill();

  // Three nested target zones.
  ctx.globalAlpha=.88;
  ctx.lineWidth=3;
  ctx.setLineDash([8,6]);
  ctx.strokeStyle=safe?'#fff':'#ff6b63';
  ctx.beginPath(); ctx.ellipse(0,0,82,9,0,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  ctx.globalAlpha=.92;
  ctx.strokeStyle='#fff';
  ctx.lineWidth=4;
  ctx.beginPath(); ctx.ellipse(0,0,38,7,0,0,Math.PI*2); ctx.stroke();

  ctx.globalAlpha=.95;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();

  ctx.restore();

  // Direction cue follows the player's horizontal error.
  if(game.landingWarnT>0){
    ctx.save();
    ctx.textAlign='center';
    ctx.font='900 13px system-ui,sans-serif';
    ctx.fillStyle=safe?'#fff':'#ff635c';
    ctx.shadowColor='rgba(0,0,0,.45)';
    ctx.shadowBlur=6;
    ctx.fillText(safe?'LANDING!':(game.player.x<cx?'→ MOVE RIGHT':'← MOVE LEFT'),cx,y-27);
    ctx.restore();
  }
}

function drawSafeLandingZone(){
  if(game.phase!=='playerUp' || game.player.vy<=120) return;
  const cx=R(), y=game.plank.y;

function drawKJumpingBackdrop(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#5faee0');

  g.addColorStop(.78,'#d9e9d0');

  // Sunlit haze
  const glow=ctx.createRadialGradient(W*.52,H*.22,10,W*.52,H*.22,H*.55);
  glow.addColorStop(0,'rgba(255,255,230,.42)');
  glow.addColorStop(1,'rgba(255,255,230,0)');
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);

  // soft spring clouds
  ctx.save();
  ctx.globalAlpha=.62;
  const clouds=[
    [.10,.16,78],[.78,.13,88],[.38,.34,68],
    [.83,.47,76],[.17,.64,82]
  ];
  clouds.forEach(([cx,cy,s])=>{
    const x=cx*W,y=cy*H;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.ellipse(x-s*.45,y+5,s*.58,s*.20,0,0,Math.PI*2);
    ctx.ellipse(x,y-s*.02,s*.72,s*.27,0,0,Math.PI*2);
    ctx.ellipse(x+s*.45,y+5,s*.54,s*.19,0,0,Math.PI*2);
    ctx.fill();
  });
  ctx.restore();

  // distant Korean mountain silhouettes
  ctx.save();
  ctx.globalAlpha=.28;
  ctx.fillStyle='#558e9a';
  ctx.beginPath();
  ctx.moveTo(0,H*.62);
  ctx.lineTo(W*.14,H*.49);
  ctx.lineTo(W*.25,H*.59);
  ctx.lineTo(W*.40,H*.44);
  ctx.lineTo(W*.55,H*.58);
  ctx.lineTo(W*.70,H*.46);
  ctx.lineTo(W*.86,H*.56);
  ctx.lineTo(W,H*.48);
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // distant village roofs
  ctx.save();
  ctx.globalAlpha=.55;
  const roof=(x,y,w)=>{
    ctx.fillStyle='#425b61';
    ctx.beginPath();
    ctx.moveTo(x-w,y);
    ctx.quadraticCurveTo(x,y-w*.30,x+w,y);
    ctx.lineTo(x+w*.78,y+w*.11);
    ctx.quadraticCurveTo(x,y-w*.05,x-w*.78,y+w*.11);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#9a704c';
    ctx.fillRect(x-w*.55,y+w*.09,w*1.1,w*.24);
  };
  roof(W*.13,H*.73,54);
  roof(W*.34,H*.68,42);
  roof(W*.63,H*.70,48);
  roof(W*.88,H*.67,58);
  ctx.restore();

  // spring blossom trees at the edges
  ctx.save();
  const tree=(x,y,s)=>{
    ctx.strokeStyle='#69503b';ctx.lineWidth=Math.max(5,s*.08);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s*.10,y-s*.58);ctx.lineTo(x+s*.10,y-s*.86);ctx.stroke();
    const blossoms=[
      [x-s*.25,y-s*.78],[x+s*.04,y-s*.98],[x+s*.28,y-s*.76],
      [x-s*.04,y-s*.64]
    ];
    blossoms.forEach(([bx,by])=>{
      ctx.fillStyle='#ffd2df';
      ctx.beginPath();ctx.arc(bx,by,s*.22,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff0f4';
      ctx.beginPath();ctx.arc(bx-s*.07,by-s*.04,s*.08,0,Math.PI*2);ctx.fill();
    });
  };
  tree(W*.08,H*.78,78);
  tree(W*.92,H*.75,88);
  ctx.restore();

  // village ground
  ctx.save();
  ctx.fillStyle='rgba(117,143,94,.18)';
  ctx.beginPath();
  ctx.moveTo(0,H*.79);
  ctx.quadraticCurveTo(W*.22,H*.73,W*.45,H*.80);
  ctx.quadraticCurveTo(W*.70,H*.72,W,H*.79);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.restore();
}

    ctx.font='24px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.globalAlpha=i<(game.lives||0)?1:.28;
    ctx.fillText(i<(game.lives||0)?'❤️':'♡',18+i*27,143);
  }
  ctx.restore();
}


function drawCommercialHUD(){
  ctx.save();

  // Top-left life card
  ctx.fillStyle='rgba(24,59,77,.78)';
  ctx.beginPath();ctx.roundRect(14,18,118,48,18);ctx.fill();
  ctx.textAlign='left';
  ctx.font='900 13px system-ui,sans-serif';
  ctx.fillStyle='#dff5ff';
  ctx.fillText('STAGE '+game.stage,27,38);
  ctx.font='900 17px system-ui,sans-serif';
  ctx.fillStyle='#fff';
  ctx.fillText('♥ '.repeat(Math.max(0,game.lives||0)),27,57);

  // Height card
  ctx.fillStyle='rgba(24,59,77,.78)';
  ctx.beginPath();ctx.roundRect(W/2-66,18,132,48,18);ctx.fill();
  ctx.textAlign='center';
  ctx.font='800 11px system-ui,sans-serif';ctx.fillStyle='#ccecf8';
  ctx.fillText('CURRENT HEIGHT',W/2,36);
  ctx.font='900 19px system-ui,sans-serif';ctx.fillStyle='#fff';
  ctx.fillText(Math.round(game.peakHeight||0)+' m',W/2,57);

  // Resource card
  ctx.fillStyle='rgba(24,59,77,.78)';
  ctx.beginPath();ctx.roundRect(W-132,18,118,48,18);ctx.fill();
  ctx.textAlign='right';
  ctx.font='900 14px system-ui,sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('⭐ '+Math.max(0,game.totalCollected||0),W-27,39);
  ctx.fillText('💎 '+Math.max(0,Math.floor((game.bonusScore||0)/30)),W-27,58);

  // Combo badge
  if((game.combo||0)>1){
    const pulse=1+Math.sin(performance.now()/100)*.035;
    ctx.translate(W-78,98);ctx.scale(pulse,pulse);
    ctx.fillStyle='rgba(111,58,28,.88)';
    ctx.beginPath();ctx.roundRect(-64,-24,128,48,18);ctx.fill();
    ctx.textAlign='center';ctx.fillStyle='#ffd86b';
    ctx.font='900 12px system-ui,sans-serif';ctx.fillText('COMBO',0,-3);
    ctx.fillStyle='#fff';ctx.font='900 20px system-ui,sans-serif';
    ctx.fillText('× '+game.combo,0,19);
  }

  // Pause button
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.arc(W-30,140,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#31586d';
  ctx.fillRect(W-37,132,5,16);ctx.fillRect(W-28,132,5,16);

  ctx.restore();
}

function drawCommercialPower(){
  if(game.phase!=='partnerReady') return;
  const y=H-128, x=W/2, width=Math.min(W*.72,310);
  ctx.save();
  ctx.textAlign='center';
  ctx.font='900 11px system-ui,sans-serif';
  ctx.fillStyle='rgba(31,70,87,.72)';
  ctx.fillText('TAP TIMING',x,y-18);

  ctx.fillStyle='rgba(255,255,255,.82)';
  ctx.beginPath();ctx.roundRect(x-width/2,y,width,12,6);ctx.fill();

  const pw=Math.max(0,Math.min(1,game.power||0));
  ctx.fillStyle='#f6c94c';
  ctx.beginPath();ctx.roundRect(x-width/2,y,width*pw,12,6);ctx.fill();

  ctx.fillStyle='#fff';
  ctx.font='900 14px system-ui,sans-serif';
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=5;
  ctx.fillText('TAP!',x,y+39);
  ctx.restore();
}

function drawCollectionBurst(){
  if((game.bonusFlash||0)<=0) return;
  const a=Math.min(1,(game.bonusFlash||0)*2);
  ctx.save();
  ctx.globalAlpha=a*.35;
  ctx.fillStyle='#fff4a0';
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=a;
  ctx.textAlign='center';
  ctx.font='900 18px system-ui,sans-serif';
  ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(92,62,0,.45)';ctx.shadowBlur=8;
  ctx.fillText('⭐ COLLECT!',W/2,H*.20);
  ctx.restore();
}


function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H*.48,H*.22,W/2,H*.48,H*.78);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(20,45,55,.18)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function draw(){
  drawKJumpingBackdrop();
  drawKEnvironmentDetails();
 drawLandingTargetFX();
  drawSafeLandingZone();
  drawLandingGuide();
 drawAirGuide();
 if(game.fever){
   ctx.save();
   ctx.globalAlpha=.045 + game.feverFlash*.035;
   ctx.fillStyle='#ffd84a';
   ctx.fillRect(0,0,W,H);
   ctx.restore();
 }
 ctx.save();
 if(game.shake>1){
   ctx.translate((Math.random()-.5)*game.shake,(Math.random()-.5)*game.shake);
 }
 // The seesaw is screen-fixed. Airborne characters are rendered from
 // gameplay coordinates into a controlled screen-space band. This avoids
 // the previous failure where camera smoothing could move both characters
 // outside the viewport.
 drawFlightTrail();
  drawStyledSeesaw();
  drawImpactFx();
 drawBonusItems();
 drawHazards();
 if(game.phase==='partnerUp'){
   const rise=Math.max(0,game.plank.y-game.partner.y);
   const sy=Math.max(H*.20,Math.min(H*.62,game.plank.y-rise*.62));
   drawKCharacter({...game.partner,y:sy},true,false);
 }else{
   drawKCharacter(game.partner,false,false);
 }
 if(game.phase==='playerUp'){
   const ascent=Math.max(0,game.plank.y-game.player.y);
   const sy=Math.max(H*.20,Math.min(H*.62,game.plank.y-ascent*.62));
   drawKCharacter({...game.player,y:sy},true,true);
 }else{
   drawKCharacter(game.player,false,true);
 }

 ctx.save();
 ctx.translate(0,0);
 for(const p of particles){
   ctx.globalAlpha=p.life/.45;
   ctx.fillStyle='#fff0a5';
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
   ctx.fill();
 }
 ctx.restore();
 ctx.globalAlpha=1;
 ctx.restore();
  drawVignette();
  drawCommercialHUD();
  drawCommercialPower();
  drawCollectionBurst();
}
function loop(t){const dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('resize',resize);
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
