<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>널뛰기 점프</title>
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/board.css">

</head>
<body>
<div id="wrap"><div id="stageEl">
  <canvas id="c"></canvas>

  <div class="scene on" id="title">
    <div id="logo">K-JUMPING<small>널뛰기팡</small></div><div style="color:#fff;font-weight:900;font-size:19px;text-shadow:0 2px 3px rgba(0,0,0,.45);margin-bottom:-8px;">하늘 끝까지, 더 높이!</div>
    <div id="best-title">최고 기록: <span id="bestNum">0</span>m</div>
    <button class="btn" id="startBtn">시작하기</button>
  </div>

  <div class="scene" id="game">
    <div id="hud">
      <div id="hearts">❤️❤️❤️</div>
      <div id="hStat">
        <div class="wood">⭐ <span id="gStar">0</span></div>
        <div class="wood">💎 <span id="gGem">0</span></div>
        <button class="wood" id="pauseBtn" aria-label="일시정지">Ⅱ</button>
      </div>
    </div>
    <div id="regionBadge"><span class="regionLeaf">✿</span><b id="regionName">하늘마을</b><span id="regionSub">최고 높이 · 0m</span></div>
    <div id="goalBadge"><span>🎯 목표 높이</span><b>100m</b></div>
    <div id="depth"><small>현재 높이</small><strong>0 m</strong></div>
    <div id="judge"></div>
    <div id="pauseOverlay"><div id="pauseCard"><h2>잠시 쉬어가기</h2><button class="btn" id="resumeBtn">계속하기</button><button class="btn" id="pauseRetryBtn">다시 시작</button></div></div>
  </div>

  <div id="progressHUD" aria-hidden="true">
    <div id="progressLine"><div id="progressFill"></div></div>
    <div class="mile m0 active"><i></i><em>0m</em></div>
    <div class="mile m1"><i></i><em>100m</em></div>
    <div class="mile m2"><i></i><em>250m</em></div>
    <div class="mile m3"><i></i><em>500m</em></div>
    <div class="mile m4"><i></i><em>1000m</em></div>
  </div>

  <div class="scene" id="result">
    <div id="resCard">
      <h2 id="resTitle">기록!</h2>
      <div id="resM">0</div>
      <div style="font-size:14px;margin-bottom:10px;">미터</div>
      <div class="line"><span>⭐ 별</span><b id="resStar">0</b></div>
      <div class="line"><span>💎 보석</span><b id="resGem">0</b></div>
    </div>
    <button class="btn" id="retryBtn">다시 하기</button>
  </div>
</div></div>




<div id="boardWoodOverlay" aria-hidden="true"><div class="plank"><div class="grain"></div></div></div>


<script src="js/game.js"></script>
<script src="js/board.js"></script>
</body>
</html>
