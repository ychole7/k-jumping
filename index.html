<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>K-JUMPING</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8e7f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
button{font:inherit;border:0}
.app{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
.title{background:#a9dff0}
.titleArt{position:absolute;left:0;right:0;top:0;height:calc(100% - 112px);background:url("assets/title/title-bg.jpg") center top/cover no-repeat}
.titleShade{position:absolute;left:0;right:0;bottom:0;height:145px;background:linear-gradient(transparent,rgba(255,236,204,.92) 38%,#b8e7f5)}
.startBtn,.playBtn{
 position:absolute;left:50%;transform:translateX(-50%);
 height:76px;border-radius:24px;
 background:linear-gradient(#ffd56b,#f39a2d);
 border:4px solid #ffe7a1;
 box-shadow:0 8px 0 #9b4d20,0 12px 22px rgba(80,45,20,.25);
 color:white;font-weight:900;letter-spacing:.5px;text-shadow:0 3px 3px rgba(120,60,20,.45)
}
.startBtn{bottom:50px;width:min(330px,72vw);font-size:32px;z-index:4}
.map{background:#b7d99f}
.mapHeader{height:108px;background:linear-gradient(#60412f,#3d291e);color:#fff;position:absolute;top:0;left:0;right:0;z-index:20;padding:18px 18px 12px;display:flex;align-items:center;gap:14px;border-bottom:3px solid #e5b24c}
.back{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:32px}
.season h1{margin:0;font-size:24px}.season p{margin:2px 0 0;color:#f2ddbd;font-size:12px}
.resources{margin-left:auto;display:flex;gap:6px}.res{padding:8px 11px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:800;font-size:13px}
.mapViewport{position:absolute;left:0;right:0;top:108px;bottom:118px;overflow:hidden}
.mapWorld{position:absolute;left:0;right:0;top:0;height:2600px;background:url("assets/map/season1-clean.jpg") center top/100% auto repeat-y}
.mapPath{position:absolute;left:50%;top:0;width:44%;height:100%;transform:translateX(-50%);background:rgba(247,204,123,.10);clip-path:polygon(43% 0,65% 10%,35% 20%,60% 30%,34% 40%,68% 50%,38% 60%,62% 70%,34% 80%,66% 90%,45% 100%);filter:blur(10px)}
.nodes{position:absolute;inset:0}
.node{position:absolute;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;background:linear-gradient(#77756e,#514f4a);border:4px solid #eee3c5;box-shadow:0 7px 0 #49433a,0 8px 14px rgba(0,0,0,.2);transform:translate(-50%,-50%)}
.node.active{width:78px;height:78px;font-size:26px;background:linear-gradient(#52c4ff,#178ee5);box-shadow:0 8px 0 #17619c,0 8px 20px rgba(0,0,0,.28)}
.mapFooter{position:absolute;left:0;right:0;bottom:0;height:118px;background:#173b43;color:#fff;z-index:30;padding:18px 24px;display:flex;align-items:center}
.stageInfo h2{margin:0;font-size:22px}.stageInfo p{margin:5px 0 0;color:#c7d7d5;font-size:12px}
.playBtn{position:relative;left:auto;transform:none;margin-left:auto;width:190px;height:66px;font-size:25px}
.game{background:#8ed6ec}
canvas{position:absolute;inset:0;width:100%;height:100%}
.gameHUD{position:absolute;top:12px;left:12px;right:12px;z-index:10;display:flex;gap:8px;align-items:center}
.pill{background:#244b5b;color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:17px;padding:9px 14px;font-weight:900}
.logoPill{background:#593b2a;border-color:#e8bf66;flex:1;text-align:center;color:#ffd36b}
.stat{min-width:74px;text-align:center}.stat b{display:block;color:#fff;font-size:11px}.stat span{font-size:19px;color:#ffe26e}
.pause{width:48px;height:48px;border-radius:50%;background:#244b5b;color:white;font-weight:900;font-size:22px}
.heightBox{position:absolute;top:78px;right:14px;width:142px;padding:10px;border-radius:18px;background:#f7fbfc;color:#244b5b;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.12);z-index:10}.heightBox small{font-weight:800}.heightBox strong{display:block;font-size:28px}
.gauge{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(360px,76vw);z-index:20;display:none}.gauge.show{display:block}
.gaugeArc{height:118px;border:14px solid #9a593a;border-bottom:0;border-radius:180px 180px 0 0;background:conic-gradient(from 270deg,#2387d9 0 22%,#48c991 22% 42%,#ffd54f 42% 58%,#ff9f2e 58% 78%,#ed5362 78% 100%);position:relative;overflow:hidden}
.needle{position:absolute;width:4px;height:100px;background:#fff;bottom:-8px;left:50%;transform-origin:50% 100%;box-shadow:0 0 4px #543;transform:rotate(55deg)}
.gaugeLabel{position:absolute;left:0;right:0;top:47px;text-align:center;color:#fff;font-weight:1000;font-size:18px;text-shadow:0 2px 3px #6c4128}
.tap{margin:10px auto 0;display:block;width:210px;height:58px;border-radius:20px;background:linear-gradient(#ffd76b,#f39b2c);border:3px solid #ffe8a7;color:#fff;font-weight:1000;font-size:24px;box-shadow:0 6px 0 #95471f}
</style>
</head>
<body>
<div class="app">
<section id="title" class="screen active title">
 <div class="titleArt"></div><div class="titleShade"></div>
 <button class="startBtn" id="start">START</button>
</section>

<section id="map" class="screen map">
 <header class="mapHeader">
  <button class="back" id="mapBack">‹</button>
  <div class="season"><h1>시즌 1</h1><p>봄의 한옥마을</p></div>
  <div class="resources"><div class="res">♥ 5</div><div class="res">● 0</div><div class="res">◆ 0</div><div class="res">1/100</div></div>
 </header>
 <div class="mapViewport" id="mapViewport"><div class="mapWorld" id="mapWorld"><div class="mapPath"></div><div class="nodes" id="nodes"></div></div></div>
 <footer class="mapFooter"><div class="stageInfo"><h2>STAGE 1</h2><p>첫 번째 널뛰기 도전!</p></div><button class="playBtn" id="play">PLAY ▶</button></footer>
</section>

<section id="game" class="screen game">
 <canvas id="gameCanvas"></canvas>
 <div class="gameHUD">
  <button class="pause">Ⅱ</button><div class="pill logoPill">K-JUMPING<br><small>널뛰기팡</small></div>
  <div class="pill stat"><b>STARS</b><span id="stars">0</span></div><div class="pill stat"><b>GEMS</b><span id="gems">0</span></div>
 </div>
 <div class="heightBox"><small>HEIGHT</small><strong id="height">0 m</strong><small>BEST 0 m</small></div>
 <div class="gauge" id="gauge"><div class="gaugeArc"><div class="needle" id="needle"></div><div class="gaugeLabel">PERFECT</div></div><button class="tap" id="tap">TAP!</button></div>
</section>
</div>
<script>
const $=s=>document.querySelector(s), screens=[...document.querySelectorAll('.screen')];
function show(id){screens.forEach(x=>x.classList.toggle('active',x.id===id))}
$('#start').onclick=()=>{show('map'); requestAnimationFrame(()=>$('#mapViewport').scrollTop=$('#mapWorld').scrollHeight-$('#mapViewport').clientHeight)};
$('#mapBack').onclick=()=>show('title');
$('#play').onclick=()=>{show('game'); resetGame(); requestAnimationFrame(gameLoop)};

const nodes=$('#nodes');
const pts=[];
for(let i=1;i<=100;i++){
 const t=(i-1)/99;
 const y=90+t*2440;
 const x=50 + Math.sin(t*9.2)*15 + Math.sin(t*2.4)*9;
 pts.push({x,y});
 const n=document.createElement('button'); n.className='node'+(i===1?' active':''); n.textContent=i;
 n.style.left=x+'%'; n.style.top=y+'px'; n.onclick=()=>{if(i===1) {$('#play').click()}};
 nodes.appendChild(n);
}

const canvas=$('#gameCanvas'),ctx=canvas.getContext('2d'); let W,H,dpr;
let state={t:0,phase:'ready',playerX:0,playerY:0,vy:0,stars:0,gems:0,height:0,gauge:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function resetGame(){state={t:0,phase:'ready',playerX:W*.5,playerY:H*.68,vy:0,stars:0,gems:0,height:0,gauge:0};$('#gauge').classList.add('show');$('#stars').textContent=0;$('#gems').textContent=0;$('#height').textContent='0 m'}
function drawBG(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fdaf1');g.addColorStop(.62,'#b8e5ee');g.addColorStop(1,'#7fa9c2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.65)';
 [[.12,.22,110,28],[.72,.3,170,38],[.42,.52,140,30]].forEach(c=>{ctx.beginPath();ctx.ellipse(W*c[0],H*c[1],c[2],c[3],0,0,Math.PI*2);ctx.fill()});
 ctx.fillStyle='rgba(74,119,131,.42)';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(i*W/5,H*.62);ctx.lineTo(i*W/5+W*.12,H*.4);ctx.lineTo(i*W/5+W*.24,H*.62);ctx.fill()}
}
function drawWorld(){
 // seesaw
 const sy=H*.76;ctx.save();ctx.translate(W/2,sy);ctx.rotate(Math.sin(state.t*1.5)*.05);
 ctx.fillStyle='#9b5b2e';ctx.fillRect(-W*.34,-12,W*.68,24);ctx.fillStyle='#71452e';ctx.beginPath();ctx.moveTo(-35,12);ctx.lineTo(0,70);ctx.lineTo(35,12);ctx.fill();ctx.restore();
 // partner
 ctx.fillStyle='#3c2b2b';ctx.beginPath();ctx.arc(W*.2,sy-48,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4aa4d7';ctx.fillRect(W*.2-28,sy-25,56,42);
}
function drawPlayer(){
 const x=state.playerX,y=state.playerY;
 ctx.save();ctx.translate(x,y);ctx.fillStyle='#34252a';ctx.beginPath();ctx.arc(0,-35,24,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f7f1df';ctx.fillRect(-28,-12,56,48);ctx.fillStyle='#d64e67';ctx.fillRect(-34,0,68,14);
 ctx.fillStyle='#4e79bb';ctx.fillRect(-10,30,20,34);ctx.restore();
}
function drawStars(){
 const baseX=state.playerX+70,baseY=state.playerY-100;
 for(let i=0;i<8;i++){const a=-2.3+i*.38;const r=80+i*12;const x=baseX+Math.cos(a)*r,y=baseY+Math.sin(a)*r;
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffd43b';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();
  for(let k=0;k<10;k++){const rr=k%2?8:20;const aa=-Math.PI/2+k*Math.PI/5;ctx.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
}
function gameLoop(ts){
 if(!$('#game').classList.contains('active'))return;
 state.t=ts/1000;
 drawBG();drawWorld();drawStars();
 if(state.phase==='flight'){state.vy+=1450/60;state.playerY+=state.vy/60;state.height=Math.max(0,Math.round((H*.76-state.playerY)*.42));$('#height').textContent=state.height+' m';
   if(state.playerY<120) state.playerY=120;
   if(state.playerY>=H*.76-80){state.phase='ready';state.playerY=H*.68;state.vy=0;$('#gauge').classList.add('show')}
 }
 drawPlayer();
 if(state.phase==='ready'){state.gauge=(Math.sin(state.t*2.2)*.5+.5);const deg=-72+state.gauge*144;$('#needle').style.transform=`rotate(${deg}deg)`}
 requestAnimationFrame(gameLoop)
}
$('#tap').onclick=()=>{
 if(state.phase==='ready'){state.phase='flight';state.vy=-1150;$('#gauge').classList.remove('show');state.stars+=5;state.gems+=1;$('#stars').textContent=state.stars;$('#gems').textContent=state.gems}
};
</script>
</body></html>
